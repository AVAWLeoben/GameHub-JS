function shieldContact(x0,y0,x1,y1,cx,cy,rx,ry,radius=0){
 const sx=(x0-cx)/(rx+radius),sy=(y0-cy)/(ry+radius);
 const dx=(x1-x0)/(rx+radius),dy=(y1-y0)/(ry+radius);
 const a=dx*dx+dy*dy,c=sx*sx+sy*sy-1;
 let nx,ny;
 if(c<=0){nx=sx;ny=sy;if(nx*nx+ny*ny<1e-8){nx=-dx;ny=-dy;}}
 else if(a>1e-10){
  const b=2*(sx*dx+sy*dy),disc=b*b-4*a*c;if(disc<0)return null;
  const t=(-b-Math.sqrt(disc))/(2*a);if(t<0||t>1)return null;
  nx=sx+dx*t;ny=sy+dy*t;
 }else return null;
 let length=Math.hypot(nx,ny);if(length<1e-8){nx=0;ny=-1;length=1;}
 return {x:cx+rx*nx/length,y:cy+ry*ny/length};
}

   const p=this.player;if(this.state!=='active'||p.grace>0)return;

   else{p.health=Math.max(0,p.health-damage);p.grace=48;}

   const p=this.player;p.shield=0;p.shieldTime=0;
   for(let i=0;i<16;i++){
    const a=i*Math.PI/8,x=p.x+Math.cos(a)*(p.w/2+16),y=p.y+Math.sin(a)*(p.h/2+18);

  enemyFire(e){
   const advanced=e.boss&&e.health<=e.max*.5;
   const fire=(vx,vy,damage=7,size=6,x=e.x)=>{
    if(this.hostile.length<180)this.hostile.push({x,y:e.y+e.h/2-9,vx,vy,damage,size});
   };
   const aim=(speed,offset=0,x=e.x)=>{
    const a=Math.atan2(this.player.y-e.y-40,this.player.x-e.x)+offset;fire(Math.cos(a)*speed,Math.sin(a)*speed,

   };
   if(e.kind==='DuneFortress'){

    const count=advanced?13:9;

   }else if(e.kind==='Spacecraft'){for(const a of [-.42,-.21,0,.21,.42])aim(4.6,a);e.shot=advanced?46:66;}

  script(){
   const episode=SCRIPTS[this.mission][this.phase];if(!episode)return;
   if(this.eventIndex<episode.length&&this.phaseFrame>=episode[this.eventIndex][0]){
    const [,kind,payload]=episode[this.eventIndex++];
    if(kind==='pickup')this.pickup(...payload);
    else for(const [typ,fraction] of kind==='boss'?[payload]:payload)this.enemy(typ,fraction);
   }
   if(this.eventIndex===episode.length){
    const last=episode[episode.length-1];
    const done=last[1]==='boss'?!this.enemies.some(e=>e.boss)&&this.frame-this.lastBoss>=100&&this.lastBoss>=0:
      this.phaseFrame>last[0]+150&&!this.enemies.length;
    if(done){
     this.phase++;this.phaseFrame=0;this.eventIndex=0;
     if(this.phase>=SCRIPTS[this.mission].length){
      this.state='landing';this.landing=0;this.landStart={x:this.player.x,y:this.player.y};
      this.player.shield=0;this.player.grace=0;this.friendly=[];this.hostile=[];
      this.enemies.forEach(e=>this.remove(e.sprite));this.enemies=[];
      this.pickups.forEach(p=>this.remove(p.sprite));this.pickups=[];
      this.carrier.y=-this.carrier.displayHeight/2;this.message.setText('LANDING APPROACH');
     }
    }
   }
  }
  step(){
   this.frame++;this.terrain.tilePositionY-=3.7;
   const p=this.player;
   if(this.state==='landing'){
    this.landing++;this.carrier.y=Math.min(426,this.carrier.y+5.7);
    const t=smooth(clamp(this.landing/205,0,1));
    p.x=this.landStart.x+(400-this.landStart.x)*t;p.y=this.landStart.y+(426-this.landStart.y)*t;p.sprite.setScale(p.base*(1-.5*t));
    if(this.landing>=205)this.results(false);
    return;
   }
   if(this.state==='takeoff'){
    const t=smooth(clamp(this.frame/105,0,1));p.y=456+(252-456)*t;p.sprite.setScale(p.base*(.5+.5*t));
    if(this.mission!==0)this.carrier.y+=3.7;
    if(this.frame>=105){this.state='active';this.messageUntil=this.frame+40;}
    return;
   }
   this.carrier.y+=3.7;
   this.escorts.forEach(e=>e.sprite.setPosition(400+e.dx,this.carrier.y+e.dy));
   this.phaseFrame++;this.script();if(this.state!=='active')return;
   if(p.grace>0)p.grace--;
   if(p.shield>0&&--p.shieldTime<=0){this.breakShield();p.grace=Math.max(p.grace,24);}
   if(this.pointer){
    p.x+=(clamp(this.pointer.x,p.w/2+7,793-p.w/2)-p.x)*.52;
    p.y+=(clamp(this.pointer.y,95,588-p.h/2)-p.y)*.52;
   }else{
    const dx=Number(this.keys.RIGHT.isDown||this.keys.D.isDown)-Number(this.keys.LEFT.isDown||this.keys.A.isDown);
    const dy=Number(this.keys.DOWN.isDown||this.keys.S.isDown)-Number(this.keys.UP.isDown||this.keys.W.isDown),length=Math.hypot(dx,dy);
    if(length){p.x+=dx/length*11.5;p.y+=dy/length*11.5;}
   }
   p.x=clamp(p.x,p.w/2+7,793-p.w/2);p.y=clamp(p.y,95,588-p.h/2);
   if(++p.shot>=7){
    const y=p.y-p.h*.38;
    for(const dx of [-p.w*.21,p.w*.21])this.friendly.push({x:p.x+dx,y,vx:0,vy:-13.5});
    if(p.weapon>=1)this.friendly.push({x:p.x,y:p.y-p.h*.46,vx:0,vy:-13.5});
    if(p.weapon>=2)for(const sign of [-1,1])this.friendly.push({x:p.x+sign*p.w*.26,y,vx:sign*6.75,vy:-13.5*Math.cos(Math.PI/6)});
    p.shot=0;
   }
   this.friendly=this.friendly.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;if(b.y<-30||b.x<-30||b.x>830)return false;
    const e=this.enemies.find(e=>e.health>0&&Math.abs(e.x-b.x)<e.w/2+4&&Math.abs(e.y-b.y)<e.h/2+10);
    if(e){e.health-=2;if(this.objects.length<250)this.burst(b.x,b.y,.45);return false;}return true;
   });
   this.enemies=this.enemies.filter(e=>{
    if(e.health<=0){
     this.score+=SCORES[e.kind];this.kills++;this.burst(e.x,e.y,e.boss?2.9:1.2);
     if(e.boss){this.bossKills++;this.lastBoss=this.frame;this.score+=p.health*10;this.hostile=[];}
     this.remove(e.sprite);return false;
    }
    e.age++;
    if(e.y<e.target)e.y=Math.min(e.target,e.y+(e.boss?4:3.6));
    else if(['Tank','AA','SAM'].includes(e.kind))e.y+=2.59;
    else if(e.kind==='UBoat')e.y+=1.65;
    else if(e.boss){e.x=clamp(400+Math.sin(e.age*.016+e.phase)*128,e.w/2,800-e.w/2);e.y=e.target+Math.sin(e.age*.035)*12;}
    else e.x=clamp(e.origin+Math.sin(e.age*.018+e.phase)*(e.kind==='B17'?70:130),e.w/2,800-e.w/2);
    e.sprite.setPosition(e.x,e.y);
    if(e.y-e.h/2>625||(!e.boss&&e.age>435)){this.remove(e.sprite);return false;}
    if(--e.shot<=0&&e.y>=e.h*.1)this.enemyFire(e);
    if(Math.abs(e.x-p.x)<e.w/2+p.w*.31&&Math.abs(e.y-p.y)<e.h/2+p.h*.375)this.hit(e.boss?16:9);
    return true;
   });
   this.hostile=this.hostile.filter(b=>{
    const oldX=b.x,oldY=b.y;b.x+=b.vx;b.y+=b.vy;
    if(b.x<-50||b.x>850||b.y<-100||b.y>700)return false;
    if(p.shield>0){
     const wave=Math.round(Math.sin(this.frame*.18)*4);
     const contact=shieldContact(oldX,oldY,b.x,b.y,p.x,p.y,(p.w+32+wave)/2,(p.h+36+wave)/2,b.size);
     if(contact){this.hit(b.damage);this.burst(contact.x,contact.y,1,true);return false;}
    }
    if(Math.abs(b.x-p.x)<p.w*.31+b.size&&Math.abs(b.y-p.y)<p.h*.375+b.size){this.hit(b.damage);this.burst(b.x,b.y,.5);return false;}
    return true;
   });
   this.pickups=this.pickups.filter(item=>{
    item.y+=4.81;item.sprite.y=item.y;
    if(Math.abs(item.x-p.x)<p.w*.31+52&&Math.abs(item.y-p.y)<p.h*.375+53){this.collect(item.kind);this.remove(item.sprite);return false;}
    if(item.y>622){this.remove(item.sprite);return false;}return true;
   });
   if(p.health<=0)this.results(true);
  }
  results(failed){
   const score=this.score,health=this.player.health,kills=this.kills,bossKills=this.bossKills;
   this.clear();this.state='results';
   this.back=this.add.image(400,300,'win').setDisplaySize(800,600);this.objects.push(this.back);
   const shade=this.add.rectangle(400,300,650,440,0x08161f,.94);this.objects.push(shade);
   this.text(400,145,failed?'MISSION FAILED':this.mission===2?'CAMPAIGN COMPLETE':'MISSION COMPLETE',36,failed?'#ff7a62':'#a2f6bc');
   this.text(400,215,NAMES[this.mission],26);
   this.text(400,285,'TARGETS '+kills+'  |  BOSSES '+bossKills,23);
   const bonus=failed?0:health*20;
   this.text(400,335,failed?'Try again!':'SURVIVAL BONUS +'+bonus,23);
   this.text(400,385,'SCORE '+(score+bonus+(this.mission===2&&!failed?this.campaign:0)),28,'#f8e291');
   this.button(400,460,340,failed?'RETRY MISSION':this.mission===2?'FINISH CAMPAIGN':'NEXT MISSION',()=>{
    if(failed)this.startMission();
    else if(this.mission===2){this.campaign=0;this.mission=0;this.menu();}
    else{this.campaign+=score+bonus;this.mission++;this.brief();}
   },true);
   this.button(400,530,340,'SELECT MISSION',()=>this.select());
  }
  render(){
   const p=this.player;p.sprite.setPosition(p.x,p.y).setVisible(!(p.grace>0&&!p.shield&&Math.floor(p.grace/5)%2));
   this.projectiles.clear();
   for(const b of this.friendly){
    const length=Math.hypot(b.vx,b.vy),ux=b.vx/length,uy=b.vy/length;
    this.projectiles.lineStyle(6,0xf9a336).lineBetween(b.x-ux*11,b.y-uy*11,b.x+ux*10,b.y+uy*10);
    this.projectiles.lineStyle(2,0xfffbcd).lineBetween(b.x,b.y,b.x+ux*10,b.y+uy*10);
   }
   for(const b of this.hostile){
    this.projectiles.fillStyle(0x180c2c).fillCircle(b.x,b.y,b.size+3).fillStyle(0xff2ab2).fillCircle(b.x,b.y,b.size+1).fillStyle(0xfffdff).fillCircle(b.x,b.y,2);
   }
   this.shield.clear();
   if(p.shield>0){
    const wave=Math.round(Math.sin(this.frame*.18)*4),w=p.w+32+wave,h=p.h+36+wave;
    this.shield.lineStyle(6,0x143664).strokeEllipse(p.x,p.y,w+12,h+12).lineStyle(3,p.grace?0xf5feff:0x67ebff).strokeEllipse(p.x,p.y,w,h);
   }
   this.healthText.setText('HULL '+p.health+'%\n'+['TWIN','TRIPLE','FIVE-WAY'][p.weapon]+(p.shield?' · SHIELD '+p.shield:''));
   this.stats.setText('SCORE '+this.score+'\nSTAGE '+(this.mission+1)+'/3 · KILLS '+this.kills);
   if(this.messageUntil&&this.frame>this.messageUntil&&this.state==='active')this.message.setText('');
   this.bossBar.clear();this.bossLabel.setText('');
   const boss=this.enemies.find(e=>e.boss);
   if(boss){const y=boss.y+boss.h/2+22;this.bossLabel.setPosition(boss.x,y-6).setText(BOSSES[boss.kind]);
    this.bossBar.fillStyle(0x101d24).fillRect(boss.x-85,y+9,170,10).fillStyle(0xf2665b).fillRect(boss.x-83,y+11,166*Math.max(0,boss.health/boss.max),6);
   }else{
    const event=SCRIPTS[this.mission][this.phase]?.[this.eventIndex];
    if(event&&event[1]==='boss'&&event[0]-this.phaseFrame<105&&Math.floor(this.frame/15)%2===0)this.message.setText('WARNING — '+BOSSES[event[2][0]]);
   }
  }
  update(time,delta){
   if(!['takeoff','active','landing'].includes(this.state)||document.hidden)return;
   this.acc=Math.min(.1,this.acc+Math.min(.05,delta/1000));
   while(this.acc>=1/60&&['takeoff','active','landing'].includes(this.state)){this.acc-=1/60;this.step();}
   if(['takeoff','active','landing'].includes(this.state))this.render();
  }
 }
 new Phaser.Game({type:Phaser.AUTO,parent:'game',width:800,height:600,backgroundColor:'#0b1926',scene:Jet,
 scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},audio:{noAudio:true}});
}
</script></body></html>
