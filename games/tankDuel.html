<script>
'use strict';
(() => {
const W=1280, H=800, FIELD_TOP=142, FIELD_BOTTOM=650, TAU=Math.PI*2;
const BG='#121d2d', PANEL='#1d2c3e', WHITE='#eaf1f4', MUTED='#9fb5c1', GOLD='#ffcc63', GREEN='#71d28c', RED='#f5645c';
const COLORS=['#4fc3eb','#f17061','#94ce71','#bb92ea','#f4bf4b','#dfe0dc'];
const BODIES={scout:[0,100,150,1],heavy:[1200,155,90,1],artillery:[900,110,110,1.4]};
const WEAPONS={cannon:[0,36,56,1,1],twin_cannon:[1000,24,48,2,1],mortar:[800,49,85,1,1.15],rocket_pod:[1600,22,62,3,.8],plasma_gun:[2000,62,43,1,.65]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const length=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const capitalize=s=>s.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());
const canvas=(w,h)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;return cv;};
function roundRect(c,x,y,w,h,r=12){c.beginPath();c.roundRect(x,y,Math.max(0,w),Math.max(0,h),r);}
function rgba(hex,alpha){const x=hex.replace('#','');return `rgba(${parseInt(x.slice(0,2),16)},${parseInt(x.slice(2,4),16)},${parseInt(x.slice(4,6),16)},${alpha})`;}
function player(i){return {i,color:i,body:'scout',weapon:'cannon',armor:0,engine:0,owned:new Set(['scout','cannon']),money:1000,wins:0,x:i?1070:210,angle:55,power:10,hp:100,fuel:150,wheel:0};}

// Small locally-generated trees are used if either shared WasteTrain tree image is unavailable.
function proceduralTree(pine=false){
  const out=canvas(120,160),c=out.getContext('2d');
  c.fillStyle='#5c3b27';c.beginPath();c.moveTo(49,155);c.lineTo(54,72);c.lineTo(65,72);c.lineTo(72,155);c.fill();
  c.strokeStyle='#b08049';c.lineWidth=5;c.beginPath();c.moveTo(58,145);c.lineTo(61,86);c.stroke();
  if(pine){for(const [y,w] of [[106,55],[77,45],[46,32]]){c.fillStyle='#286d43';c.beginPath();c.moveTo(60,y-44);c.lineTo(60-w,y+26);c.lineTo(60+w,y+26);c.closePath();c.fill();c.fillStyle='#54a258';c.beginPath();c.moveTo(60,y-44);c.lineTo(60-w,y+20);c.lineTo(60,y+10);c.fill();}}
  else {for(const [x,y,r] of [[35,80,30],[84,80,31],[59,49,38],[60,90,38]]){c.fillStyle='#316f35';c.beginPath();c.arc(x,y,r,0,TAU);c.fill();c.fillStyle='#63a04a';c.beginPath();c.arc(x-5,y-7,r-6,0,TAU);c.fill();c.fillStyle='#92bf59';c.beginPath();c.arc(x-10,y-15,Math.max(6,r/3),0,TAU);c.fill();}}
  return out;
}
function loadImage(url){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(new Error(url));i.src=url;});}
function cropAlpha(img){
  const cv=canvas(img.naturalWidth||img.width,img.naturalHeight||img.height),c=cv.getContext('2d',{willReadFrequently:true});
  c.drawImage(img,0,0);let data;try{data=c.getImageData(0,0,cv.width,cv.height).data;}catch{return img;}
  let a=cv.width,b=cv.height,x2=0,y2=0;
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++)if(data[(y*cv.width+x)*4+3]>8){a=Math.min(a,x);b=Math.min(b,y);x2=Math.max(x2,x);y2=Math.max(y2,y);}
  if(a>x2||b>y2)return img;
  const crop=canvas(x2-a+1,y2-b+1);crop.getContext('2d').drawImage(cv,a,b,crop.width,crop.height,0,0,crop.width,crop.height);return crop;
}
class Scenery {
  constructor(game){this.g=game;this.treeSources=[proceduralTree(),proceduralTree(true)];this.trees=[];this.particles=[];this.background=null;this.loadTrees();}
  async loadTrees(){
    const paths=['../assets/wasteTrain/scenery/tree_broadleaf.png','../assets/wasteTrain/scenery/tree_pine.png'];
    const loaded=await Promise.allSettled(paths.map(loadImage));
    const found=loaded.filter(r=>r.status==='fulfilled').map(r=>cropAlpha(r.value));
    if(!found.length){try{found.push(cropAlpha(await loadImage('../assets/wasteGOL/tree.png')));}catch{}}
    if(found.length){this.treeSources=found;this.newRound();}
  }
  newRound(){
    this.makeBackground();this.trees=[];this.particles=[];
    for(const side of [0,1]){
      const layers=[false,false,false,true,true];layers.sort(()=>rnd(-1,1));
      for(let i=0;i<5;i++){
        const x=side?W-(70+i*101+rnd(-15,15)):70+i*101+rnd(-15,15);
        const src=this.treeSources[Math.floor(Math.random()*this.treeSources.length)];
        const h=[94,110,126,142][Math.floor(rnd(0,4))];
        const w=h*src.width/src.height;
        this.trees.push({x,y:this.g.ground(x),image:src,w,h,front:layers[i],flip:Math.random()>.5,alive:true,fall:0,dir:1});
      }
    }
  }
  makeBackground(){
    const cv=canvas(W,H),c=cv.getContext('2d');
    const pal=[['#beddf2','#739e67','#aac466','#568458','#406846'],['#b7daef','#7ca15f','#bbca63','#5e894c','#416b43'],['#cae4f0','#6e9a6d','#a3c171','#51825d','#3b674c']][Math.floor(rnd(0,3))];
    c.fillStyle=pal[0];c.fillRect(0,0,W,H);
    // Warm sun and pale clouds provide a less sterile battlefield.
    const sunx=rnd(930,1135),suny=rnd(196,228);
    c.fillStyle='#e1ecda';c.beginPath();c.arc(sunx,suny,54,0,TAU);c.fill();
    c.fillStyle='#ffeea9';c.beginPath();c.arc(sunx,suny,38,0,TAU);c.fill();
    for(const [xx,yy,size] of [[110,210,1],[390,178,.8],[775,246,.85],[1150,292,.65]]){
      const x=xx+rnd(-35,35),y=yy+rnd(-12,12);c.fillStyle='#eaf5f8';
      for(const [dx,dy,r] of [[-29,4,20],[-9,-8,25],[16,-3,21],[38,7,15]]){c.beginPath();c.arc(x+dx*size,y+dy*size,r*size,0,TAU);c.fill();}
      c.fillRect(x-32*size,y,73*size,20*size);
    }
    // Multiple overlapping mountain ridges and rolling foothills.
    for(const [xx,yy,width] of [[40,273,260],[290,230,330],[565,293,315],[850,224,350],[1165,270,300]]){
      const x=xx+rnd(-20,20),peak=yy+rnd(-22,22),left=x-width*.65,right=x+width*.65;
      c.fillStyle=pal[1];c.beginPath();c.moveTo(left,505);c.lineTo(x-width*.19,peak+60);c.lineTo(x-12,peak+4);c.lineTo(x,peak);c.lineTo(x+15,peak+9);c.lineTo(right,505);c.closePath();c.fill();
      c.fillStyle=pal[2];c.beginPath();c.moveTo(x-width*.19,peak+60);c.lineTo(x-12,peak+4);c.lineTo(x,peak);c.lineTo(x+15,peak+9);c.lineTo(x+width*.28,peak+115);c.lineTo(x+width*.07,peak+94);c.lineTo(x-7,peak+104);c.lineTo(x-21,peak+85);c.closePath();c.fill();
    }
    for(const [color,base,amp,phase] of [[pal[3],426,34,1],[pal[4],483,24,3.2]]){
      c.fillStyle=color;c.beginPath();c.moveTo(-10,H);
      for(let x=-10;x<=W+10;x+=10)c.lineTo(x,base+Math.sin(x/127+phase)*amp+Math.sin(x/63+phase)*amp*.23);
      c.lineTo(W,H);c.closePath();c.fill();
    }
    c.fillStyle=pal[4];for(let x=12;x<W;x+=65){const y=483+Math.sin(x/127+3.2)*24+Math.sin(x/63+3.2)*24*.23,h=rnd(10,21);c.beginPath();c.moveTo(x,y-h);c.lineTo(x-h*.45,y+5);c.lineTo(x+h*.45,y+5);c.fill();}
    this.background=cv;
  }
  blast(x,y,radius){
    for(const tree of this.trees){if(!tree.alive)continue;
      const left=tree.x-tree.w/2,top=tree.y-tree.h;
      const dx=x-clamp(x,left,left+tree.w),dy=y-clamp(y,top,tree.y);
      if(dx*dx+dy*dy<=radius*radius || this.g.ground(tree.x)>tree.y+9)this.topple(tree,x);
    }
  }
  topple(tree,impactX){
    tree.alive=false;tree.fall=0;tree.dir=tree.x>=impactX?1:-1;
    for(let k=0;k<12;k++){
      const leaf=k<9;
      this.particles.push({x:tree.x+rnd(-tree.w*.3,tree.w*.3),y:leaf?tree.y-tree.h*rnd(.45,.85):tree.y-18,
        vx:tree.dir*rnd(25,100)+rnd(-35,35),vy:rnd(-160,-45),life:rnd(1.2,2.2),leaf,phase:rnd(0,TAU),size:rnd(3,6),color:leaf?['#70a440','#aabc49','#417d44'][Math.floor(rnd(0,3))]:'#92643a'});
    }
  }
  update(dt){
    for(const t of this.trees){if(!t.alive)t.fall=Math.min(1,t.fall+dt);else if(this.g.ground(t.x)>t.y+9)this.topple(t,t.x-1);}
    for(const p of this.particles){p.life-=dt;p.phase+=dt*8;p.vx+=this.g.wind*dt*(p.leaf?2.4:.4);p.vy+=(p.leaf?125:490)*dt;
      p.x+=p.vx*dt+(p.leaf?Math.sin(p.phase)*15*dt:0);p.y+=p.vy*dt;
      if(p.x>=0&&p.x<W&&p.y>=this.g.ground(p.x)){p.y=this.g.ground(p.x)-2;p.vx=0;p.vy=0;p.life=Math.min(p.life,.25);}
    }
    this.particles=this.particles.filter(p=>p.life>0);
  }
  treesLayer(c,front){
    for(const t of this.trees){if(t.front!==front)continue;
      const overlapped=front && this.g.players.some(p=>p.hp>0&&Math.abs(p.x-t.x)<t.w*.5+38&&this.g.ground(p.x)>t.y-t.h-25);
      c.save();c.globalAlpha=overlapped?.51:1;c.translate(t.x,t.y);
      if(t.alive){c.fillStyle='#4c5735';c.beginPath();c.ellipse(0,-1,t.w*.26,4,0,0,TAU);c.fill();c.scale(t.flip?-1:1,1);c.drawImage(t.image,-t.w/2,-t.h,t.w,t.h);}
      else {
        c.fillStyle='#6f4f31';c.beginPath();c.moveTo(-6,0);c.lineTo(-4,-10);c.lineTo(3,-7);c.lineTo(6,0);c.fill();
        if(t.fall<.95){c.globalAlpha*=clamp((.95-t.fall)/.45,0,1);const angle=t.dir*Math.pow(Math.min(1,t.fall/.85),1.6)*Math.PI*.47;
          c.rotate(angle);c.scale(t.flip?-1:1,1);c.drawImage(t.image,-t.w/2,-t.h,t.w,t.h);}
      }c.restore();
    }
  }
  leaves(c){for(const p of this.particles){c.save();c.globalAlpha=clamp(p.life*2,0,1);c.translate(p.x,p.y);c.rotate(p.phase);c.fillStyle=p.color;
    if(p.leaf){c.beginPath();c.ellipse(0,0,p.size,Math.max(1,p.size*Math.abs(Math.sin(p.phase))*.6),0,0,TAU);c.fill();}
    else c.fillRect(-p.size/2,-p.size/2,p.size,p.size);c.restore();}}
}
class TankDuel {
  constructor(scene){
    this.s=scene;this.c=scene.surface.context;
    this.state='menu';this.mode='free';this.players=[player(0),player(1)];this.buildPlayer=0;
    this.round=0;this.active=0;this.wind=0;this.t=0;this.notice='';this.denied=0;
    this.terrain=new Float32Array(W).fill(575);this.grounds=[575,575];this.obstacle={x:575,y:350,w:130,h:400};this.tower=true;
    this.terrainDirty=true;this.terrainImage=null;this.shots=[];this.fx=[];this.debris=[];this.smoke=[];this.floaters=[];
    this.charge=null;this.aimPointer=null;this.aimPoint=null;this.tutorial=true;
    this.holds=new Map();this.keys=new Set();this.paused=false;this.homeConfirm=false;this.shake=0;
    this.rig=null;this.art={};this.tint={};this.scenery=new Scenery(this);this.loadArt();
  }
  async loadArt(){
    for(const root of ['../assets/tank_game_assets/','../tank_game_assets/']){
      try{
        const res=await fetch(root+'rig/tank_rig.json');if(!res.ok)continue;
        const rig=await res.json(),paths=new Set();
        for(const r of Object.values(rig.tanks||{}))for(const n of r.nodes||[])if(n.sprite)paths.add(n.sprite.replace('{color}','green'));
        for(const w of Object.values(rig.weapons||{}))if(w.sprite)paths.add(w.sprite.replace('{color}','green'));
        for(const p of Object.values(rig.projectiles||{}))if(p.sprite)paths.add(p.sprite.replace('{color}','green'));
        for(let i=0;i<8;i++)paths.add(`png/fx/explosion_${i}.png`);
        const entries=await Promise.all([...paths].map(async path=>{try{return [path,await loadImage(root+path)];}catch{return [path,null];}}));
        this.rig=rig;this.art=Object.fromEntries(entries.filter(p=>p[1]));return;
      }catch{}
    }
    // The game stays playable with procedurally drawn tanks if the optional tank rig is absent.
  }
  maxHp(p){return BODIES[p.body][1]+p.armor*25;}
  maxFuel(p){return BODIES[p.body][2]+p.engine*35;}
  ground(x){return this.terrain[Math.floor(clamp(x,0,W-1))];}
  tankHit(p){return {x:p.x-38,y:this.grounds[p.i]-51,w:76,h:51};}
  limits(p){
    if(!this.rig)return [5,85];
    try{
      const tank=this.rig.tanks[p.body],slot=tank.nodes.find(n=>n.id==='weapon_slot')?.joint?.rotation;
      const aim=this.rig.weapons[p.weapon]?.aimRange;
      if(!slot||!aim)return [5,85];
      const lo=Math.max(5,-Math.min(slot.max,aim[1])),hi=Math.min(-slot.min,-aim[0]);
      return lo<=hi?[lo,hi]:[5,85];
    }catch{return [5,85];}
  }
  settleTanks(){
    for(const p of this.players){let y=Infinity;for(let i=-4;i<=4;i++)y=Math.min(y,this.ground(p.x+i*7));this.grounds[p.i]=y;}
  }
  resetInput(){this.holds.clear();this.keys.clear();this.charge=null;this.aimPointer=null;this.aimPoint=null;}
  goHome(){this.resetInput();this.homeConfirm=true;}
  action(a){
    if(a==='exit'){location.href='../index.html';return;}
    if(a==='pause'){this.paused=true;this.resetInput();return;}
    if(a==='resume'){this.paused=false;return;}
    if(a==='menu'){this.paused=false;this.homeConfirm=false;this.state='menu';this.resetInput();return;}
    if(a==='next'){this.state='build';this.buildPlayer=0;this.resetInput();return;}
    if(a==='begin'){this.state='battle';this.resetInput();return;}
  }
  newCampaign(mode){this.mode=mode;this.players=[player(0),player(1)];this.round=0;this.buildPlayer=0;this.state='build';this.paused=false;this.tutorial=true;this.resetInput();}
  buy(kind,name){
    const p=this.players[this.buildPlayer];let price=0;
    if(kind==='body'||kind==='weapon'){
      price=(kind==='body'?BODIES:WEAPONS)[name][0];if(p.owned.has(name))price=0;
    }else if(kind==='fuel')price=Math.ceil(Math.max(0,this.maxFuel(p)-p.fuel)*2);
    else {if(p[kind]>=3){if(this.mode==='free')p[kind]=0;else this.notice='Maximum upgrade';return;}price=500+p[kind]*350;}
    if(this.mode==='money'&&p.money<price){this.notice='Not enough coins yet';this.denied=.75;return;}
    if(this.mode==='money')p.money-=price;
    if(kind==='body'||kind==='weapon'){p[kind]=name;p.owned.add(name);}
    else if(kind==='fuel')p.fuel=this.maxFuel(p);
    else p[kind]++;
    p.fuel=Math.min(p.fuel,this.maxFuel(p));p.hp=this.maxHp(p);p.angle=clamp(p.angle,...this.limits(p));this.notice='';
  }
  startRound(){
    this.resetInput();this.round++;
    const left=[510,550,590][Math.floor(rnd(0,3))],right=clamp(left+[-80,0,80][Math.floor(rnd(0,3))],490,610);
    this.obstacle={x:575,y:[325,365,405][Math.floor(rnd(0,3))],w:130,h:400};this.tower=Math.random()>.5;
    for(let x=0;x<W;x++){const inRock=x>=this.obstacle.x&&x<=this.obstacle.x+this.obstacle.w;
      this.terrain[x]=inRock?(this.tower?this.obstacle.y:this.obstacle.y+(Math.abs(x-640)>40?45:0)):(x<640?left:right);
    }
    this.terrainDirty=true;this.shots=[];this.fx=[];this.floaters=[];this.debris=[];this.smoke=[];this.shake=0;
    for(const p of this.players){p.x=p.i?1070:210;p.hp=this.maxHp(p);p.angle=clamp(p.angle,...this.limits(p));p.wheel=0;}
    this.settleTanks();this.scenery.newRound();this.active=(this.round-1)%2;this.beginTurn();
  }
  beginTurn(){
    const p=this.players[this.active];if(this.mode==='free')p.fuel=this.maxFuel(p);
    this.wind=Math.round(rnd(-35,35));this.state='handoff';this.resetInput();
  }
  startCharge(id){
    if(this.state!=='battle'||this.paused||this.charge)return;
    const p=this.players[this.active];this.charge={id,from:p.power,elapsed:0};this.tutorial=false;
  }
  finishCharge(id){if(!this.charge||this.charge.id!==id)return;this.charge=null;this.fire();}
  fire(){
    if(this.state!=='battle'||this.shots.length)return;
    const p=this.players[this.active],spec=WEAPONS[p.weapon];
    for(let i=0;i<spec[3];i++){
      const offset=(i-(spec[3]-1)/2)*2;
      const shot=this.projectile(p,p.angle+offset);shot.damage=spec[1]*BODIES[p.body][3];shot.r=spec[2]*(p.body==='artillery'?1.20:1);
      this.shots.push(shot);
    }
    this.state='flight';this.tutorial=false;this.resetInput();this.settle=0;
  }
  projectile(p,angle=p.angle,power=p.power){
    const rad=angle*Math.PI/180,d=p.i?-1:1,speed=310+power*5.1;
    return {x:p.x+d*Math.cos(rad)*48,y:this.grounds[p.i]-30-Math.sin(rad)*48,
      vx:d*Math.cos(rad)*speed,vy:-Math.sin(rad)*speed,age:0,weapon:p.weapon,owner:p.i,trail:[]};
  }
  physicsStep(dt){
    for(const shot of [...this.shots]){
      shot.age+=dt;shot.vx+=this.wind*dt;shot.vy+=400*WEAPONS[shot.weapon][4]*dt;
      const before={x:shot.x,y:shot.y};shot.x+=shot.vx*dt;shot.y+=shot.vy*dt;
      const hitTerrain=shot.x>=0&&shot.x<W&&shot.y>=this.ground(shot.x);

      this.text(this.charge?'CHARGING '+Math.round(p.power)+'%':'HOLD • RELEASE TO FIRE',925,741,this.charge?22:19,WHITE);

    } else if(this.state==='handoff') {
      this.text('Pass the iPad to the highlighted player',640,712,23,MUTED);

  }
  drawMenu(){

    this.icon('engine',298,540,GOLD,35);this.icon('armor',392,540,GOLD,35);this.icon('play',500,540,GREEN,32);
    this.text('BUILD & PLAY',390,616,31,WHITE);this.text('Free workshop',390,654,23,'#c7d7d7');
    this.button('',680,430,420,248,()=>this.newCampaign('money'));
    this.icon('coin',790,540,GOLD,36);this.icon('plus',880,540,WHITE,24);this.icon('trophy',975,540,GOLD,35);
    this.text('COIN CAMPAIGN',890,616,30,WHITE);this.text('Earn upgrades',890,654,22,'#c7d7d7');

  drawBuild(){
    const p=this.players[this.buildPlayer];
    this.box(0,0,W,H,BG,0);this.box(36,20,250,76,COLORS[p.color],37);
    this.badge(p,161,58,25);this.text('PLAYER '+(this.buildPlayer+1),323,59,26,WHITE,'left');
    if(this.mode==='money'){this.icon('coin',1092,56,GOLD,23);this.text(p.money,1130,58,35,GOLD,'left');}
    this.text('SELECT A TANK BODY',36,104,17,MUTED,'left');
    for(const [i,name] of Object.keys(BODIES).entries()){
      const x=36+i*202,y=119;
      this.button('',x,y,190,156,()=>this.buy('body',name),{selected:p.body===name});
      this.text(capitalize(name),x+95,y+22,19,WHITE);
      const demo={...p,i:0,body:name,angle:25};this.tank(demo,x+95,y+111,.72);
      this.text('HP '+BODIES[name][1]+'   FUEL '+BODIES[name][2],x+95,y+140,15,MUTED);
      if(this.mode==='money'&&!p.owned.has(name))this.text(BODIES[name][0]+' coins',x+95,y+48,14,GOLD);
    }
    this.text('WEAPONS',36,281,17,MUTED,'left');
    for(const [i,name] of Object.keys(WEAPONS).entries()){
      const x=36+(i%3)*202,y=300+Math.floor(i/3)*110;
      this.button('',x,y,190,99,()=>this.buy('weapon',name),{selected:p.weapon===name});
      this.text(capitalize(name),x+95,y+25,17,WHITE);
      const im=this.art[this.rig?.weapons?.[name]?.sprite?.replace('{color}','green')];

      else this.icon('fire',x+95,y+58,GOLD,17);
      this.text('×'+WEAPONS[name][3]+'  Dmg '+WEAPONS[name][1],x+95,y+81,14,MUTED);
      if(this.mode==='money'&&!p.owned.has(name))this.text(WEAPONS[name][0],x+166,y+16,13,GOLD);
    }
    this.text('COLOUR',36,517,17,MUTED,'left');
    for(let i=0;i<COLORS.length;i++){
      const x=36+i*101;
      this.button('',x,536,88,76,()=>{p.color=i;},{selected:p.color===i});
      this.circle(x+44,574,26,COLORS[i]);if(p.color===i)this.icon('check',x+44,574,BG,13);
    }
    this.box(680,112,564,326,PANEL,16);
    this.text('YOUR TANK',963,155,25,GOLD);this.tank(p,962,330,1.46);
    this.text('HP '+this.maxHp(p),746,382,19,WHITE,'left');this.text('FUEL '+this.maxFuel(p),746,415,19,GREEN,'left');
    this.text('BLAST ×'+(p.body==='artillery'?'1.2':'1.0'),1090,415,18,GOLD);
    for(const [i,kind] of ['armor','engine'].entries()){
      const y=448+i*83;
      this.button('',680,y,564,74,()=>this.buy(kind,'upgrade'));
      this.icon(kind,722,y+37,GOLD,21);
      this.text(capitalize(kind),805,y+37,24,WHITE);
      for(let k=0;k<3;k++)this.circle(920+k*43,y+37,12,k<p[kind]?GOLD:'#475663');
      this.icon(p[kind]>=3?'check':'plus',1188,y+37,GOLD,16);
      if(this.mode==='money'&&p[kind]<3)this.text(''+(500+p[kind]*350),1090,y+37,20,GOLD);
    }
    if(this.mode==='money'){
      this.button('',680,618,564,68,()=>this.buy('fuel','refill'));
      this.icon('fuel',720,652,GOLD,20);this.bar(764,643,227,17,p.fuel,this.maxFuel(p),GREEN);
      this.text(Math.ceil(Math.max(0,this.maxFuel(p)-p.fuel)*2)+' coins',1105,652,21,GOLD);
    }
    if(this.notice)this.text(this.notice,412,663,23,this.denied?RED:GOLD);
    this.button('MENU',36,702,171,78,()=>this.action('menu'));
    this.button(this.buildPlayer===0?'NEXT PLAYER':'START ROUND',680,697,564,85,()=>{if(this.buildPlayer===0){this.buildPlayer=1;this.notice='';}else this.startRound();},{primary:true});
  }
  drawHandoff(){
    this.s.zones=this.s.zones.filter(z=>z.x===774&&z.y===28);
    this.box(0,FIELD_TOP,W,FIELD_BOTTOM-FIELD_TOP,'rgba(14,28,39,.53)',0);
    const p=this.players[this.active];
    this.box(300,161,680,476,BG,17,COLORS[p.color]);
    this.badge(p,368,225,32);this.text('PLAYER '+(this.active+1)+' TURN',640,231,44,WHITE);
    this.tank(p,640,370,1.45);
    const icons=['play','up','fire'];for(let k=0;k<icons.length;k++){
      this.box(430+k*142,423,108,67,PANEL,14);
      this.icon(icons[k],484+k*142,455,k===2?GOLD:WHITE,25);
      if(k<icons.length-1)this.icon('right',553+k*142,455,MUTED,11);
    }
    this.text('Aim · Hold to charge · Release to fire',640,514,23,MUTED);
    this.button('READY',440,548,400,78,()=>this.action('begin'),{primary:true});
  }
  drawResult(){
    this.s.zones=this.s.zones.filter(z=>z.x===774&&z.y===28);
    const p=this.winner===null?null:this.players[this.winner];
    this.box(360,164,560,260,BG,18,p?COLORS[p.color]:GOLD);
    this.text(p?'PLAYER '+(p.i+1)+' WINS!':'A DRAW!',640,203,36,WHITE);
    this.icon('trophy',640,269,GOLD,36);
    if(this.mode==='money'){
      this.text('P1 +'+(this.winner===0?1200:700)+' coins',505,309,20,GOLD);
      this.text('P2 +'+(this.winner===1?1200:700)+' coins',785,309,20,GOLD);
    }else if(p)this.text(p.wins+' round'+(p.wins===1?'':'s')+' won',640,312,21,MUTED);
    this.button('WORKSHOP',404,343,200,62,()=>this.action('next'));
    this.button('REMATCH',633,343,245,62,()=>this.startRound(),{primary:true});
  }
  drawPause(){
    this.s.zones=[];this.box(0,0,W,H,'rgba(7,17,27,.72)',0);
    this.box(330,226,620,344,BG,18,'#6c8a9c');
    this.icon('pause',640,279,MUTED,22);this.text('PAUSED',640,326,42,WHITE);
    this.button('RESUME',359,391,177,105,()=>this.action('resume'),{primary:true});
    this.button('WORKSHOP',550,391,177,105,()=>this.action('next'));
    this.button('HOME',741,391,177,105,()=>this.goHome());
  }
  drawLeave(){
    this.s.zones=[];this.box(0,0,W,H,'rgba(7,17,27,.83)',0);
    this.box(360,250,560,300,BG,17,GOLD);
    this.icon('home',640,303,GOLD,27);
    this.text('Return to GameHub?',640,363,34,WHITE);
    this.text('Your current round will end.',640,408,21,MUTED);
    this.button('STAY',385,460,227,64,()=>{this.homeConfirm=false;},{primary:true});
    this.button('LEAVE',663,460,227,64,()=>this.action('exit'));
  }
  draw(){
    const c=this.c;this.s.zones=[];c.clearRect(0,0,W,H);
    if(this.state==='menu')this.drawMenu();
    else if(this.state==='build')this.drawBuild();
    else {this.drawField();this.drawTopHud();this.drawFooter();
      if(this.state==='handoff')this.drawHandoff();
      if(this.state==='result')this.drawResult();
    }
    // Home is always in the rendered 1280x800 stage, never a page-level overlay.
    if(this.state==='menu'||this.state==='build'){
      this.button('',770,22,96,86,()=>this.goHome(),{icon:'home'});
    }
    if(this.paused)this.drawPause();
    if(this.homeConfirm)this.drawLeave();
  }
}

if(typeof Phaser==='undefined'){
  document.getElementById('error').hidden=false;
}else{
  class TankScene extends Phaser.Scene {
    constructor(){super('tank-duel');}
    create(){
      this.zones=[];
      this.surface=this.textures.createCanvas('tank-stage',W,H);
      this.picture=this.add.image(0,0,'tank-stage').setOrigin(0);
      this.duel=new TankDuel(this);
      this.input.addPointer(3);
      this.input.on('pointerdown',p=>this.duel.pointerDown({x:p.x,y:p.y,id:p.id}));
      this.input.on('pointermove',p=>this.duel.pointerMove({x:p.x,y:p.y,id:p.id}));
      this.input.on('pointerup',p=>this.duel.pointerUp({x:p.x,y:p.y,id:p.id}));
      this.input.on('pointerupoutside',p=>this.duel.pointerUp({x:p.x,y:p.y,id:p.id}));
      this.input.keyboard.on('keydown',e=>{
        if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Space'].includes(e.key))e.preventDefault();
        this.duel.keyDown(e.key);
      });
      this.input.keyboard.on('keyup',e=>this.duel.keyUp(e.key));
      this.onBlur=()=>{this.duel.paused=true;this.duel.resetInput();};
      window.addEventListener('blur',this.onBlur);
      this.events.once('shutdown',()=>window.removeEventListener('blur',this.onBlur));
    }
    update(_time,ms){
      if(!this.duel)return;
      this.duel.update(Math.min(ms/1000,.05));this.duel.draw();this.surface.refresh();
    }
  }
  new Phaser.Game({
    type:Phaser.CANVAS,
    parent:'game',width:W,height:H,
    backgroundColor:BG,
    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},
    input:{activePointers:5},render:{antialias:true},scene:TankScene,
    audio:{noAudio:true}
  });
}
})();
