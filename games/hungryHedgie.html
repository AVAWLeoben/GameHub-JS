'use strict';
(() => {

 {name:'A cosy bed',goal:6,cap:3,reward:'A cosy bed is ready!',next:"Let's grow a berry garden."},
 {name:'A little garden',goal:8,cap:4,reward:'Your garden is growing!',next:"Let's make a picnic for friends."},

class HungryHedgie {

 }

  this.friend={x:285,y:442};this.friendGoal={x:205,y:370};this.friendWait=0;

 }

 }

 handleDown(q){

 }
 handleMove(q){if(this.pointer!==q.id||this.mode!=='play'||q.y<113||q.y>501)return;this.target={x:clamp(q.x,49,751),y:clamp(q.y,145,478)};}

 }

 }

  }}
 drawPath(){if(!this.carry||this.delivery>0)return;const c=this.c,target={x:650,y:295},delta={x:target.x-this.pos.x,y:target.y-this.pos.y},d=Math.hypot(delta.x,delta.y);if(d<55)return;
  const steps=Math.max(2,Math.floor(d/27));for(let i=1;i<steps;i++){const t=i/steps;ellipse(c,this.pos.x+delta.x*t,this.pos.y+delta.y*t,(i+Math.floor(this.time*3))%4===0?4:3,3,'#ffed9a');}
  const ux=delta.x/d,uy=delta.y/d,mx=this.pos.x+ux*57,my=this.pos.y+uy*57;c.fillStyle='#fff2b1';c.beginPath();c.moveTo(mx+ux*12,my+uy*12);c.lineTo(mx-ux*8-uy*10,my-uy*8+ux*10);c.lineTo(mx-ux*8+uy*10,my-uy*8-ux*10);c.fill();
 }
 drawWorld(){const c=this.c;c.drawImage(this.background,0,0);this.drawHome();this.drawPath();this.drawBerries();
  if(this.stage>0){if(!this.lantern){ellipse(c,376,296,25,25,'#ffe49a55');if(!this.image('torch',369,279,14,33)){rect(c,369,284,14,23,'#86683e',3);rect(c,373,285,6,14,'#ffdc75',2);}}
   if(this.friend.y<this.pos.y){this.drawPlayer(this.friend.x,this.friend.y,55,47,true,this.friendGoal.x<this.friend.x);heart(c,this.friend.x,this.friend.y-34+Math.sin(this.time*2)*2,6);}
  }
  if(this.glow){c.strokeStyle='#fff0b0';c.lineWidth=2;c.beginPath();c.ellipse(this.pos.x,this.pos.y,37,29,0,0,TAU);c.stroke();}
  this.drawPlayer(this.pos.x,this.pos.y,62,49,false,this.left);
  if(this.carry){rect(c,this.pos.x-19,this.pos.y-33,38,20,'#986b41',5);line(c,this.pos.x-18,this.pos.y-25,this.pos.x+18,this.pos.y-25,'#e2bd76',3);for(let i=0;i<this.carry;i++)berry(c,this.pos.x-(this.carry-1)*3.5+i*7,this.pos.y-34,8);}
  if(this.stage>0&&this.friend.y>=this.pos.y){this.drawPlayer(this.friend.x,this.friend.y,55,47,true,this.friendGoal.x<this.friend.x);heart(c,this.friend.x,this.friend.y-34+Math.sin(this.time*2)*2,6);}
  for(const f of this.flows)if(f.time>=0){const t=clamp(f.time/.6,0,1);berry(c,f.x+(f.ex-f.x)*t,f.y+(f.ey-f.y)*t-Math.sin(t*Math.PI)*48,17);}
  for(const p of this.particles)ellipse(c,p.x,p.y,Math.max(1,p.life*4),Math.max(1,p.life*4),'#ffe789');
  if(this.mode==='play'&&dist(this.pos,this.target)>20){c.strokeStyle='#f2eab3';c.lineWidth=2;c.beginPath();c.arc(this.target.x,this.target.y,11,0,TAU);c.stroke();ellipse(c,this.target.x,this.target.y,3,3,'#f2eab3');}
 }
 rewardArt(){const c=this.c,stage=this.stage;ellipse(c,400,278,139,52,'#e5e6bd');
  if(stage===0){this.drawBed(410,289,1.55);this.drawPlayer(389,269,69,55,false,true);heart(c,445,236,12);}
  else if(stage===1){for(let i=0;i<5;i++){const x=312+i*44,y=287-(i%2)*18;ellipse(c,x,y,24,12,'#8ea767');line(c,x,y,x,y-32,C.green,4);flower(c,x,y-34,'#efa087',2);berry(c,x+8,y-9,17);}}
  else{this.drawPicnic(400,288,1.2);for(const [x,y] of [[290,273],[506,273],[400,228]]){this.drawPlayer(x,y,55,43);heart(c,x,y-34,8);}}
 }
 drawPanel(){const c=this.c;rect(c,0,0,W,H,'rgba(30,53,43,.57)');
  // Background is inert while a modal panel is visible. Keep only Home & sound.
  this.s.zones=[];this.panel(151,119,498,393,27);
  if(this.mode==='menu'){
   this.text('Hello, little Hedgie!',400,158,37,C.green,700);this.text("Let's make a cosy home.",400,195,23);
   berry(c,264,274,44);this.drawPlayer(400,274,62,49);rect(c,503,268,54,43,'#ba915b',8);
   c.fillStyle=C.green;c.beginPath();c.moveTo(493,270);c.lineTo(530,241);c.lineTo(567,270);c.fill();rect(c,523,285,16,26,'#5a5237',5);
   for(const x of [323,455]){line(c,x-14,275,x+10,275,'#a3ae7c',4);c.fillStyle='#a3ae7c';c.beginPath();c.moveTo(x+17,275);c.lineTo(x+5,267);c.lineTo(x+5,283);c.fill();}
   this.text('Find',264,332,22);this.text('Carry',400,332,22);this.text('Bring home',530,332,22);this.text('Tap where you want to go.',400,375,22);
  }else if(this.mode==='pause'){
   this.text('A little rest',400,170,38,C.green,700);this.rewardArt();this.text('Hedgie and the berries can wait.',400,367,21);
  }else{
   this.text(STAGES[this.stage].reward,400,163,31,C.green,700,445);this.rewardArt();this.text(STAGES[this.stage].next,400,351,21);
   if(this.stage===2)this.text('24 berries shared. Three lovely things made.',400,389,18);
   else{this.text('Your basket grows!',400,385,20);for(let i=0;i<STAGES[this.stage+1].cap;i++)berry(c,400-(STAGES[this.stage+1].cap-1)*10+i*20,404,12);}
  }
  const label=this.mode==='menu'?"Let's play!":this.mode==='pause'?'Keep playing':this.stage===2?'Play again':"Let's go!";
  rect(c,250,421,300,61,C.green,20);this.text(label,400,452,27,C.cream,700);
  this.clickBox(250,421,300,61,()=>{if(this.mode==='menu'){this.mode=this.delivered>=STAGES[this.stage].goal?'reward':'play';this.playSound('home');}
   else if(this.mode==='pause')this.mode='play';else this.advance();this.cancel();});
  this.homeButton();this.soundButton();
 }
 draw(){this.s.zones=[];this.c.clearRect(0,0,W,H);this.drawWorld();this.drawHUD();if(this.mode!=='play')this.drawPanel();}
}
if(typeof Phaser==='undefined'){document.getElementById('error').hidden=false;return;}
class HedgieScene extends Phaser.Scene{
 constructor(){super('hungry-hedgie');}
 preload(){const root='../assets/hungryHedgie/';for(const n of ['hedgie','enemy','tree','burrow','berry','torch','grass'])this.load.image(n,root+n+'.png');
  this.load.image('home','../assets/retBut.png');this.load.image('homeDown','../assets/retBut_clicked.png');}
 imageSource(key){if(!this.textures.exists(key))return null;try{return this.textures.get(key).getSourceImage();}catch{return null;}}
 create(){this.zones=[];this.keys={};this.surface=this.textures.createCanvas('hedgie-screen',W,H);this.sprite=this.add.image(0,0,'hedgie-screen').setOrigin(0);
  this.hedgie=new HungryHedgie(this);this.input.addPointer(3);
  const q=p=>({x:p.x,y:p.y,id:p.id});
  this.input.on('pointerdown',p=>this.hedgie.handleDown(q(p)));
  this.input.on('pointermove',p=>this.hedgie.handleMove(q(p)));
  this.input.on('pointerup',p=>this.hedgie.handleUp(q(p)));
  this.input.on('pointerupoutside',p=>this.hedgie.handleUp(q(p)));
  this.input.keyboard.on('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();this.keys[e.key]=true;
   if(e.key==='Escape'){if(this.hedgie.mode==='play'){this.hedgie.mode='pause';this.hedgie.cancel();}else if(this.hedgie.mode==='pause')this.hedgie.mode='play';}
  });
  this.input.keyboard.on('keyup',e=>{this.keys[e.key]=false;});
  window.addEventListener('blur',()=>{this.hedgie.cancel();if(this.hedgie.mode==='play')this.hedgie.mode='pause';this.hedgie.persist();});
  this.hedgie.draw();this.surface.refresh();
 }
 update(_,ms){this.hedgie.update(Math.min(ms/1000,.05));this.hedgie.draw();this.surface.refresh();}
}
new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:W,height:H,backgroundColor:'#2b4233',
 scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},input:{activePointers:5},render:{antialias:true},scene:HedgieScene,audio:{noAudio:true}});
})();
