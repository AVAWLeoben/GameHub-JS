  if(this.glow){c.strokeStyle='#fff0b0';c.lineWidth=2;c.beginPath();c.ellipse(this.pos.x,this.pos.y,37,29,0,0,TAU);c.stroke();}
  this.drawPlayer(this.pos.x,this.pos.y,62,49,false,this.left);
  if(this.carry){const basketW=39+(STAGES[this.stage].cap-3)*3;
    if(this.stage>0){
     if(!this.imageContain('basketArt',this.pos.x-basketW/2-3,this.pos.y-47,basketW+6,35))rect(c,this.pos.x-basketW/2,this.pos.y-34,basketW,20,'#986b41',5);
    }else{
     rect(c,this.pos.x-basketW/2,this.pos.y-33,basketW,20,'#986b41',5);
     line(c,this.pos.x-basketW/2+1,this.pos.y-25,this.pos.x+basketW/2-1,this.pos.y-25,'#e2bd76',3);
    }
    for(let i=0;i<this.carry;i++)berry(c,this.pos.x-(this.carry-1)*3.5+i*7,this.pos.y-34,8);
  }
  if(this.stage>0&&!this.calm&&this.friend.y>=this.pos.y){this.drawPlayer(this.friend.x,this.friend.y,55,47,true,this.friendGoal.x<this.friend.x);heart(c,this.friend.x,this.friend.y-34+Math.sin(this.time*2)*2,6);}
  // Soft warning for the slow rival; never lose berries, no scary effects.
  if(this.stage>0&&!this.calm&&dist(this.pos,this.friend)<85){
   const y=this.friend.y-63+Math.sin(this.time*2)*3;
   ellipse(c,this.friend.x,y,22,17,'#fff4dc');ellipse(c,this.friend.x-18,y+16,4,4,'#fff4dc');
   this.text('?',this.friend.x,y,23,'#7b755a',800);
  }
  for(const f of this.flows)if(f.time>=0){const t=clamp(f.time/.6,0,1);berry(c,f.x+(f.ex-f.x)*t,f.y+(f.ey-f.y)*t-Math.sin(t*Math.PI)*48,17);}
  for(const p of this.particles)ellipse(c,p.x,p.y,Math.max(1,p.life*4),Math.max(1,p.life*4),'#ffe789');
  if(this.mode==='play'&&dist(this.pos,this.target)>20){c.strokeStyle='#f2eab3';c.lineWidth=2;c.beginPath();c.arc(this.target.x,this.target.y,11,0,TAU);c.stroke();ellipse(c,this.target.x,this.target.y,3,3,'#f2eab3');}
 }
 drawPanel(){
  const c=this.c,reset=this.mode==='confirmReset',menu=this.mode==='menu';
  rect(c,0,0,W,H,'#1e352b99');
  this.s.zones=[];
  this.panel(226,157,348,286,24);
  this.text(reset?'Start over?':menu?'Hungry Hedgie':'Paused',400,193,31,C.green,750);
  berry(c,315,258,38);this.drawPlayer(400,256,73,58);
  this.imageContain('burrow',460,214,72,67);
  this.homeAction(reset?'↻  Reset':'▶  Play',284,305,232,64,()=>{
   if(reset||menu&&!this.hadCurrentSave)this.newHome();
   else this.leaveHome();
  });
  if(!reset)this.homeAction(this.calm?'♥':'♧',584,312,62,62,()=>{this.calm=!this.calm;this.persist();});
  if(reset)this.homeAction('↩  Back',284,381,232,48,()=>{this.mode='menu';});
  else if(menu&&this.hadCurrentSave)this.homeAction('↻  New',250,382,130,48,()=>this.requestNewHome());
  if(menu&&this.legacyAvailable)this.homeAction('↶  Old save',390,382,158,48,()=>this.resumeOldHome());
  this.homeButton();this.soundButton();
 }
 draw(){
  const c=this.c;
  this.s.zones=[];
  c.clearRect(0,0,W,H);
  if(this.mode==='homeVisit'){this.drawHomeInterior();return;}
  this.drawWorld();this.drawHUD();
  if(this.mode!=='play')this.drawPanel();
 }
}
if(typeof Phaser==='undefined'){document.getElementById('error').hidden=false;return;}
class HedgieScene extends Phaser.Scene{
 constructor(){super('hungry-hedgie');}
 preload(){const root='../assets/hungryHedgie/';for(const n of ['hedgie','enemy','tree','burrow','berry','torch','grass'])this.load.image(n,root+n+'.png');
  for(const [k,name] of Object.entries({denBackground:'home_interior',bedSingle:'bed_single',bedDouble:'bed_double',bedBaby:'bed_baby',tableArt:'dining_table',lanternArt:'hanging_lantern',picnicArt:'picnic_blanket',pantryArt:'pantry',basketArt:'basket_upgrade',buntingArt:'bunting'}))this.load.image(k,ASSET_HOME_PATH+name+'.webp');
  this.load.image('home','../assets/retBut.png');this.load.image('homeDown','../assets/retBut_clicked.png');}
 imageSource(key){if(!this.textures.exists(key))return null;try{return this.textures.get(key).getSourceImage();}catch{return null;}}
 create(){this.zones=[];this.keys={};this.surface=this.textures.createCanvas('hedgie-screen',W,H);this.sprite=this.add.image(0,0,'hedgie-screen').setOrigin(0);
  this.hedgie=new HungryHedgie(this);this.input.addPointer(3);
  const fit=()=>{
   const {width,height}=this.scale;
   this.zoom=Math.min(width/W,height/470);
   this.offsetX=(width-W*this.zoom)/2;this.offsetY=(height-H*this.zoom)/2;
   this.top=Math.max(0,-this.offsetY/this.zoom);this.bottom=H-this.top;
   this.sprite.setPosition(this.offsetX,this.offsetY).setScale(this.zoom);
   this.hedgie.cancel();
  };
  fit();this.scale.on('resize',fit);
  const q=p=>({x:(p.x-this.offsetX)/this.zoom,y:(p.y-this.offsetY)/this.zoom,id:p.id});
  this.input.on('pointerdown',p=>this.hedgie.handleDown(q(p)));
  this.input.on('pointermove',p=>this.hedgie.handleMove(q(p)));
  this.input.on('pointerup',p=>this.hedgie.handleUp(q(p)));
  this.input.on('pointerupoutside',()=>this.hedgie.cancel());
  this.game.canvas.addEventListener('touchcancel',()=>this.hedgie.cancel());
  this.input.keyboard.on('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();this.keys[e.key]=true;
   if(e.key==='Escape'){if(this.hedgie.mode==='play'){this.hedgie.mode='pause';this.hedgie.cancel();}else if(this.hedgie.mode==='pause')this.hedgie.leaveHome();}
  });
  this.input.keyboard.on('keyup',e=>{this.keys[e.key]=false;});
  window.addEventListener('pagehide',()=>this.hedgie.persist());
  window.addEventListener('blur',()=>{this.hedgie.cancel();if(this.hedgie.mode==='play')this.hedgie.mode='pause';this.hedgie.persist();});
  this.hedgie.draw();this.surface.refresh();
 }
 update(_,ms){this.hedgie.update(Math.min(ms/1000,.05));this.hedgie.draw();this.surface.refresh();}
}
new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:W,height:H,backgroundColor:'#2b4233',
 scale:{mode:Phaser.Scale.RESIZE},input:{activePointers:5},render:{antialias:true},scene:HedgieScene,audio:{noAudio:true}});
})();
</script>
