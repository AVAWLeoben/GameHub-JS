<script>
const STAGES=[{name:'A cosy bed',goal:6,cap:3,reward:'A cosy bed is ready!'},{name:'A little garden',goal:8,cap:4,reward:'Your garden is growing!'},{name:'A picnic for friends',goal:10,cap:5,reward:'A picnic for everyone!'}];
class Hedgie{
 constructor(s){this.s=s;this.stage=0;this.delivered=0;this.carry=0;this.pos={x:670,y:270};this.target={...this.pos};this.mode='menu';this.build();const p=saved('hedgie-js-v1',null);if(p&&Number.isInteger(p.stage)&&p.stage>=0&&p.stage<3){this.stage=p.stage;this.build();const goal=STAGES[this.stage].goal;if(Number.isInteger(p.delivered)&&Number.isInteger(p.carry)&&p.delivered>=0&&p.carry>=0&&p.carry<=STAGES[this.stage].cap&&p.delivered+p.carry<=goal&&Array.isArray(p.active)&&p.active.length===goal&&p.active.every(v=>typeof v==='boolean')&&p.active.filter(Boolean).length===goal-p.delivered-p.carry){this.delivered=p.delivered;this.carry=p.carry;this.berries.forEach((b,i)=>b.active=p.active[i]);}}this.notice='Tap a berry to walk to it.';this.noticeTime=4;}
 build(){const xy=[[521,328],[458,298],[447,402],[343,372],[315,249],[214,318],[149,425],[202,193],[390,175],[103,278]];this.berries=xy.slice(0,STAGES[this.stage].goal).map(([x,y])=>({x,y,active:true}));this.friend={x:285,y:442};this.lantern=false;this.glow=0;this.bump=0;this.delivery=0;}
 persist(){save('hedgie-js-v1',{stage:this.stage,delivered:this.delivered,carry:this.carry,active:this.berries.map(b=>b.active)});}
 world(p){const r=this.s.field(4/3,90);return {x:(p.x-r.x)/r.w*800,y:(p.y-r.y)/r.h*600};}
 down(p){if(this.mode!=='play'||this.delivery>0)return;this.pointer=p.id;this.move(p);}
 move(p){if(p.id!==this.pointer)return;const q=this.world(p);this.target={x:clamp(q.x,49,751),y:clamp(q.y,145,478)};}
 up(p){if(p.id===this.pointer)this.pointer=null}cancel(){this.pointer=null;if(this.pos)this.target={...this.pos};}
 toast(t){this.notice=t;this.noticeTime=3;}
 update(dt){if(this.mode!=='play')return;this.noticeTime-=dt;this.glow=Math.max(0,this.glow-dt);this.bump=Math.max(0,this.bump-dt);if(this.delivery>0){this.delivery-=dt;if(this.delivery<=0&&this.delivered>=STAGES[this.stage].goal)this.mode='reward';return;}const s=this.s,k={x:(s.keys.ArrowRight||s.keys.d?1:0)-(s.keys.ArrowLeft||s.keys.a?1:0),y:(s.keys.ArrowDown||s.keys.s?1:0)-(s.keys.ArrowUp||s.keys.w?1:0)};if(k.x||k.y){const d=Math.hypot(k.x,k.y);this.target={x:clamp(this.pos.x+k.x/d*188*dt,49,751),y:clamp(this.pos.y+k.y/d*188*dt,145,478)};}const dx=this.target.x-this.pos.x,dy=this.target.y-this.pos.y,d=Math.hypot(dx,dy);if(d>.1){this.pos.x+=dx*Math.min(1,188*dt/d);this.pos.y+=dy*Math.min(1,188*dt/d);this.left=dx<0;}
 if(this.pos.x>572&&this.pos.y<323&&this.pos.y>232&&this.carry){this.delivered+=this.carry;this.carry=0;this.delivery=1;this.target={...this.pos};this.toast('Thank you, Hedgie!');this.persist();return;}
 for(const b of this.berries)if(b.active&&dist(this.pos,b)<(this.glow?47:33)&&this.carry<STAGES[this.stage].cap){b.active=false;this.carry++;this.toast(this.carry===STAGES[this.stage].cap?'Basket full. Let’s go home!':'You found a berry!');this.persist();}
 if(this.stage>0){const goal=Math.sin(s.time*.2)>0?{x:425,y:446}:{x:205,y:370},d=dist(this.friend,goal);if(d>1){this.friend.x+=(goal.x-this.friend.x)*Math.min(1,29*dt/d);this.friend.y+=(goal.y-this.friend.y)*Math.min(1,29*dt/d);}if(!this.lantern&&dist(this.pos,{x:376,y:296})<42){this.lantern=true;this.glow=14;this.toast('A lantern! Reach a little farther.');}if(!this.bump&&dist(this.pos,this.friend)<37){this.bump=3;this.toast('Oops! Your berries are safe.');}}}
 advance(){if(this.stage===2){this.stage=0;}else this.stage++;this.carry=this.delivered=0;this.build();this.pos={x:670,y:302};this.target={...this.pos};this.mode='play';this.persist();}
 draw(){const s=this.s,r=s.field(4/3,90),c=s.c;s.title('HUNGRY HEDGIE',`${STAGES[this.stage].name} · Home ${this.delivered}/${STAGES[this.stage].goal} · Basket ${this.carry}/${STAGES[this.stage].cap}`);c.save();c.translate(r.x,r.y);c.scale(r.w/800,r.h/600);s.box(0,0,800,600,'#a6bd7d');s.image('grass',0,0,800,600);s.box(45,130,710,365,'#b1c88a',80);s.line([{x:660,y:290},{x:510,y:370},{x:320,y:440},{x:160,y:430}],'#c9cb9b',42);if(!s.image('homeArt',566,117,210,165)){s.circle(670,210,95,'#6f9560');s.box(625,190,85,95,'#654b38',40);}if(this.carry){s.line([{x:this.pos.x,y:this.pos.y-45},{x:665,y:285}],'#ffec9c88',4);s.text('HOME',675,300,20,'#594a32');}if(this.stage>0||this.delivered>=6){s.box(625,214,75,42,'#f0d99c');s.box(630,215,22,18,'#fff4d4');}if(this.stage>1||this.stage===1&&this.delivered===8){for(let i=0;i<5;i++){s.box(580+i*28,335,18,30,'#4e8a52');s.circle(589+i*28,332,9,'#a64b68');}}if(this.stage===2&&this.delivered===10){s.box(450,380,110,70,'#e19e95');for(let i=0;i<5;i++)s.circle(465+i*18,406,7,'#ae4f67');}
 for(const b of this.berries)if(b.active){s.circle(b.x,b.y,20,'#f4e5aa66');if(!s.image('berry',b.x-14,b.y-14,28,28))s.circle(b.x,b.y,12,'#a93e65');}if(this.stage>0){s.image('friend',this.friend.x-28,this.friend.y-25,56,48);if(!this.lantern)s.image('torch',369,275,15,34);}if(this.glow)s.circle(this.pos.x,this.pos.y,42,'#ffe89566');if(!s.image('hedgie',this.pos.x-31,this.pos.y-25,62,49,0,this.left)){s.circle(this.pos.x,this.pos.y,25,'#705347');s.circle(this.pos.x+20,this.pos.y+4,12,'#e9cda5');}for(let i=0;i<this.carry;i++)s.circle(this.pos.x-15+i*8,this.pos.y-27,5,'#b94e69');c.restore();s.text(this.noticeTime>0?this.notice:'Collect berries and bring them home.',500,s.h-40,23,'#fff0bc');if(this.mode==='menu')s.card('Hello, Hedgie!',['Collect berries and bring them home.','Your deliveries build a bed, a garden, and a picnic.'],[['Let’s play',()=>{this.mode=this.delivered===STAGES[this.stage].goal?'reward':'play';}]]);if(this.mode==='reward')s.card(STAGES[this.stage].reward,[this.stage===2?'You made a lovely home for everyone.':'A bigger basket is ready for the next adventure.'],[[this.stage===2?'Play again':'Next adventure',()=>this.advance()]]);}
}
const GAME={name:'Hungry Hedgie',Game:Hedgie,assets:Object.fromEntries(['hedgie','enemy','tree','burrow','berry','torch','grass'].map(n=>[{enemy:'friend',burrow:'homeArt'}[n]||n,'../assets/hungryHedgie/'+n+'.png']))};

'use strict';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),TAU=Math.PI*2;
function saved(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
if(typeof Phaser==='undefined'){document.getElementById('error').hidden=false;}else{
class HubScene extends Phaser.Scene{
 constructor(){super('game');this.assets={home:'../assets/retBut.png',homeDown:'../assets/retBut_clicked.png',...GAME.assets};}
 preload(){for(const [k,p] of Object.entries(this.assets))this.load.image(k,p);}
 create(){this.keys={};this.holds=new Map();this.zones=[];this.time=0;this.paused=false;this.input.addPointer(4);this.input.keyboard.on('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(!this.paused&&!this.keys[e.key])this.gameplay?.key?.(e.key);this.keys[e.key]=true;if(e.key==='Escape')this.pause();});this.input.keyboard.on('keyup',e=>{this.keys[e.key]=false;});this.input.on('pointerdown',p=>this.down(p));this.input.on('pointermove',p=>this.move(p));this.input.on('pointerup',p=>this.up(p));this.input.on('pointerupoutside',p=>this.up(p));this.scale.on('resize',()=>this.resize());this.game.events.on('blur',()=>this.pause(true));document.addEventListener('visibilitychange',()=>{if(document.hidden)this.pause(true);});this.resize();this.gameplay=new GAME.Game(this);}
 resize(){this.w=1000;this.h=750;if(this.picture)this.picture.destroy();if(this.textures.exists('screen'))this.textures.remove('screen');this.tex=this.textures.createCanvas('screen',this.w,Math.round(this.h));this.c=this.tex.context;this.picture=this.add.image(0,0,'screen').setOrigin(0).setDisplaySize(this.scale.width,this.scale.height);this.cancel();this.gameplay?.resize?.();}
 cancel(){this.holds.clear();this.keys={};this.gameplay?.cancel?.();}
 pause(force=false){if(!this.gameplay)return;this.paused=force||!this.paused;this.cancel();}
 pt(p){return{x:p.x*this.w/this.scale.width,y:p.y*this.h/this.scale.height,id:p.id};}
 down(p){const q=this.pt(p);for(const z of [...this.zones].reverse()){if(q.x>=z.x&&q.x<=z.x+z.w&&q.y>=z.y&&q.y<=z.y+z.h){this.holds.set(q.id,{zone:z});if(typeof z.fn==='function')z.fn(q);else this.gameplay?.control?.(z.fn,true,q);return;}}if(!this.paused){this.holds.set(q.id,{world:true});this.gameplay?.down?.(q);}}
 move(p){const q=this.pt(p),hold=this.holds.get(q.id);if(!hold)return;if(hold.world&&!this.paused)this.gameplay?.move?.(q);else hold.zone?.drag?.(q);}
 up(p){const q=this.pt(p),hold=this.holds.get(q.id);this.holds.delete(q.id);if(!hold)return;if(hold.world)this.gameplay?.up?.(q);else if(typeof hold.zone.fn==='string')this.gameplay?.control?.(hold.zone.fn,false,q);hold.zone?.up?.(q);}
 held(name){return [...this.holds.values()].some(h=>h.zone?.fn===name);}
 update(_,ms){const dt=Math.min(ms/1000,.05);this.time+=dt;if(!this.paused)this.gameplay?.update?.(dt);this.zones=[];this.c.fillStyle=GAME.bg||'#152e3d';this.c.fillRect(0,0,this.w,this.h);this.gameplay?.draw?.();if(this.paused){this.zones=[];this.veil();this.text('PAUSED',500,this.h/2-55,40);this.button('Resume',350,this.h/2,300,64,()=>this.pause(),true);}const home=this.button('',12,12,54,54,()=>{});home.tag='home';home.up=q=>{if(q.x>=12&&q.x<=66&&q.y>=12&&q.y<=66){this.gameplay?.persist?.();location.href='../index.html';}};const homePressed=[...this.holds.values()].some(h=>h.zone?.tag==='home');if(!this.image(homePressed&&this.textures.exists('homeDown')?'homeDown':'home',12,12,54,54))this.text('⌂',39,38,34);if(!this.paused)this.button('Ⅱ',934,12,54,54,()=>this.pause());this.tex.refresh();}
 text(t,x,y,size=20,color='#f3f8ee',align='center'){this.c.font=`600 ${size}px system-ui,sans-serif`;this.c.fillStyle=color;this.c.textAlign=align;this.c.textBaseline='middle';this.c.fillText(String(t),x,y);}
 box(x,y,w,h,color='#244c59',radius=14){const c=this.c;c.fillStyle=color;c.beginPath();c.roundRect(x,y,Math.max(0,w),Math.max(0,h),radius);c.fill();}

 line(points,color,width=3){if(points.length<2)return;const c=this.c;c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(points[0].x,points[0].y);for(const p of points.slice(1))c.lineTo(p.x,p.y);c.stroke();}
 image(key,x,y,w,h,angle=0,flip=false){if(!this.textures.exists(key))return false;const c=this.c;c.save();c.translate(x+w/2,y+h/2);c.rotate(angle);c.scale(flip?-1:1,1);c.drawImage(this.textures.get(key).getSourceImage(),-w/2,-h/2,w,h);c.restore();return true;}
 button(label,x,y,w,h,fn,primary=false){this.box(x,y,w,h,primary?'#c4eaa4':'#244c59');this.text(label,x+w/2,y+h/2,Math.min(21,w/9),primary?'#254638':'#f4f8ee');const z={x,y,w,h,fn};this.zones.push(z);return z;}
 title(name,sub=''){this.text(name,500,34,28);if(sub)this.text(sub,500,66,16,'#c6d6d5');}
 veil(){this.c.fillStyle='#102634e8';this.c.fillRect(0,0,1000,this.h);}
 card(title,lines,buttons){this.zones=[];this.veil();const y=Math.max(110,this.h/2-140);this.text(title,500,y,38,'#d3efb3');lines.forEach((l,i)=>this.text(l,500,y+58+i*32,20));buttons.forEach((b,i)=>this.button(b[0],300,y+90+lines.length*32+i*70,400,56,b[1],i===0));}
 field(ratio=4/3,bottom=90){const maxW=964,maxH=this.h-100-bottom;const w=Math.min(maxW,maxH*ratio),h=w/ratio;return{x:(1000-w)/2,y:90+(maxH-h)/2,w,h};}
}
globalThis.GameHubScene=HubScene;
