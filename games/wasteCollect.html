<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script id="gamehub-orientation-device">
  // Do not treat a narrow desktop browser window as a phone in portrait.
  // iPadOS can identify itself as macOS, hence the MacIntel touch check.
  (() => {
    const ua = navigator.userAgent || '';
    const ipadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
    if (/Android|iPad|iPhone|iPod|Silk|Kindle|PlayBook|Mobile|Tablet/i.test(ua) || ipadOS) {
      document.documentElement.classList.add('gamehub-handheld');
    }
  })();
</script>
<title>Waste Collect · GameHub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a1e;color:white;font:18px system-ui;overscroll-behavior:none}
#game{width:100%;height:100vh;height:100dvh}canvas{display:block;touch-action:none}
#home{position:fixed;z-index:3;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));width:88px;height:88px;touch-action:manipulation}
#home img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#home .pressed{opacity:0}#home:active .pressed{opacity:1}
#home:focus-visible{outline:3px solid #ffe862;border-radius:12px}
#status{padding:110px 20px;text-align:center;white-space:pre-wrap}
</style><style id="gamehub-landscape">
/* Like WastePizza: one proportional landscape game frame; Phaser FITs its own canvas. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#viewport{position:fixed;inset:0;box-sizing:border-box;
 padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
         env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
 display:grid;place-items:center;container-type:size;overflow:hidden}
#playfield{position:relative;overflow:hidden;isolation:isolate;transform:translateZ(0);
 width:min(100%,133.333dvh);aspect-ratio:4/3;max-height:100%;container-type:inline-size}
@supports (width:1cqh){#playfield{width:min(100cqw,133.333cqh)}}
#playfield #game{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
 max-width:none!important;max-height:none!important;min-width:0!important;min-height:0!important;margin:0!important}
#playfield canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#playfield header{position:absolute!important;top:1.25cqw!important;left:1.25cqw!important;
 width:12.5cqw!important;height:12.5cqw!important;padding:0!important;z-index:6!important;background:transparent!important}
#playfield header .home-button,#playfield header .home-button img{width:100%!important;height:100%!important}
#playfield #home{top:1.25cqw!important;left:1.25cqw!important;right:auto!important;
 width:9cqw!important;height:9cqw!important;z-index:6!important}
#playfield #pause{top:1.25cqw!important;right:1.25cqw!important;z-index:6!important}
#playfield .panel{position:absolute!important;inset:0!important;z-index:4;box-sizing:border-box;
 padding:1.75cqw!important;overflow:auto;align-items:center;justify-content:center}
#playfield .panel .box{max-width:94%;padding:clamp(8px,2cqw,24px)!important;
 font-size:clamp(11px,1.9cqw,18px);}
#playfield .panel h1{font-size:clamp(18px,3.5cqw,34px);margin:.35em 0}
#playfield .panel h2{font-size:clamp(15px,2.8cqw,26px);margin:.35em 0}
#playfield .panel p{margin:.45em 0}
#playfield .panel button{min-height:clamp(33px,5.5cqw,52px);padding:clamp(4px,.8cqw,12px) clamp(10px,2.3cqw,24px);
 font-size:clamp(12px,2cqw,18px)}
#orientation-warning{display:none;position:fixed;inset:0;z-index:2147483646;box-sizing:border-box;
 background:#0a1924;color:white;place-content:center;justify-items:center;text-align:center;gap:16px;padding:24px;
 font:600 20px/1.4 system-ui,sans-serif}
#orientation-warning a{color:#ffe3a4}
@media (orientation: portrait) { html.gamehub-handheld #orientation-warning { display: grid; } }
</style>
</head><body>
<div id="viewport"><div id="playfield">

<a id="home" href="../index.html" aria-label="Return to Game Menu"><img src="../assets/retBut.png" alt=""><img class="pressed" src="../assets/retBut_clicked.png" alt=""></a>
<main id="game" aria-label="Waste Collect"><p id="status" role="status">Loading Waste Collect…</p></main>
</div></div>
<div id="orientation-warning" role="status"><div>Turn your device sideways to play</div><a href="../index.html">Return to Game Menu</a></div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script>
'use strict';
const status=document.getElementById('status');
const clamp=(value,low,high)=>Math.max(low,Math.min(high,value));
const targetCount=score=>Math.max(1,Math.floor(Math.max(score,1)/10))+2;
function contained(item,binX){
 const half=item.size/2;
 return item.x-half>=binX-75&&item.x+half<=binX+75&&item.y-half>=425&&item.y+half<=575;
}
if(!window.Phaser)status.textContent='Could not load Phaser. Check your connection and reload.';
else launch();

function launch(){
 class Collect extends Phaser.Scene{
  preload(){
   this.failed=[];
   this.load.on('loaderror',file=>this.failed.push(file.url));
   this.load.image('background','../assets/wasteCollect/background/background.jpg');
   this.load.image('bin','../assets/trashBin_green_open.png');
   this.load.image('star','../assets/star.png');
   this.itemKeys=['banana','can','paperbox'];
   for(const name of this.itemKeys)this.load.image(name,'../assets/'+name+'.png');
   for(let i=1;i<=8;i++){
    const name='card_'+i;this.itemKeys.push(name);
    this.load.image(name,'../assets/wasteCollect/'+name+'.png');
   }
  }
  create(){
   if(this.failed.length){
    status.textContent='These images could not load:\n'+this.failed.join('\n')+'\nOpen the game through GitHub Pages or a local web server.';
    return;
   }
   status.hidden=true;
   this.add.image(400,300,'background').setDisplaySize(800,600);
   this.items=[];this.stars=[];this.score=0;this.pointer=null;
   this.bin=this.add.image(400,500,'bin').setDisplaySize(150,150).setDepth(3);
   this.scoreLabel=this.add.text(785,18,'Score: 0',{
    fontFamily:'system-ui',fontSize:36,color:'#ffffff',stroke:'#163641',strokeThickness:5
   }).setOrigin(1,0).setDepth(5);
   this.hint=this.add.text(400,590,'Hold and slide your finger to catch the falling objects',{
    fontFamily:'system-ui',fontSize:19,color:'#ffffff',stroke:'#163641',strokeThickness:4
   }).setOrigin(.5,1).setDepth(5);
   this.time.delayedCall(6500,()=>this.hint.setVisible(false));
   this.input.on('pointerdown',p=>{
    if(this.pointer!==null||p.button>0)return;
    this.pointer=p;this.moveBin(p.x);
   });
   this.input.on('pointermove',p=>{if(this.pointer===p&&p.isDown)this.moveBin(p.x);});
   const release=p=>{if(this.pointer===p)this.pointer=null;};
   this.input.on('pointerup',release);this.input.on('pointerupoutside',release);
   const cancel=()=>{this.pointer=null;};
   window.addEventListener('blur',cancel);
   document.addEventListener('visibilitychange',cancel);
   this.game.canvas.addEventListener('touchcancel',cancel);
   this.scale.on('resize',cancel);
   this.keys=this.input.keyboard.addKeys('LEFT,RIGHT,A,D');
   this.fillObjects();
  }
  moveBin(x){this.bin.x=clamp(x,75,725);}
  fillObjects(){
   const missing=targetCount(this.score)-this.items.length;
   // Bound retries even when the sky gets crowded at high scores.
   for(let n=0;n<missing;n++){
    for(let attempt=0;attempt<30;attempt++){
     const size=Phaser.Math.Between(75,85);
     const item={size,x:Phaser.Math.Between(Math.ceil(size/2),800-Math.ceil(size/2)),
      y:Phaser.Math.Between(-1000,-5),vy:0,maxSpeed:Phaser.Math.Between(3,5)*60};
     const overlaps=this.items.some(other=>
      Math.abs(item.x-other.x)<(item.size+other.size)/2&&
      Math.abs(item.y-other.y)<(item.size+other.size)/2);
     if(overlaps)continue;
     item.sprite=this.add.image(item.x,item.y,Phaser.Utils.Array.GetRandom(this.itemKeys))
      .setDisplaySize(size,size).setDepth(1);
     this.items.push(item);break;
    }
   }
  }
  celebrate(x,y){
   for(let i=0;i<18;i++){
    const sprite=this.add.image(x,y,'star').setDisplaySize(10,10).setDepth(4);
    this.stars.push({sprite,vx:Phaser.Math.Between(60,600)*(Math.random()<.5?-1:1),
     vy:-Phaser.Math.Between(600,1200),life:1});
   }
  }
  update(time,delta){
   if(!this.bin||document.hidden)return;
   const dt=Math.min(delta/1000,.05);
   if(!this.pointer){
    const dx=Number(this.keys.RIGHT.isDown||this.keys.D.isDown)-Number(this.keys.LEFT.isDown||this.keys.A.isDown);
    this.moveBin(this.bin.x+dx*650*dt);
   }
   const steps=Math.max(1,Math.ceil(dt*120)),h=dt/steps;
   for(let step=0;step<steps;step++){
    for(let i=this.items.length-1;i>=0;i--){
     const item=this.items[i];
     item.vy=Math.min(item.maxSpeed,item.vy+3600*h);item.y+=item.vy*h;
     if(contained(item,this.bin.x)){
      this.score++;this.celebrate(item.x,item.y);
      item.sprite.destroy();this.items.splice(i,1);
     }else if(item.y>700){
      this.score--;item.sprite.destroy();this.items.splice(i,1);
     }else item.sprite.setPosition(item.x,item.y);
    }
   }
   for(let i=this.stars.length-1;i>=0;i--){
    const star=this.stars[i];star.life-=dt;
    if(star.life<=0){star.sprite.destroy();this.stars.splice(i,1);continue;}
    star.sprite.x+=star.vx*dt;star.vy+=3600*dt;star.sprite.y+=star.vy*dt;
   }
   this.scoreLabel.setText('Score: '+this.score);
   this.fillObjects();
  }
 }
 new Phaser.Game({type:Phaser.AUTO,parent:'game',width:800,height:600,backgroundColor:'#0a0a1e',scene:Collect,
  scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},audio:{noAudio:true}});
}
</script></body></html>
