  // iPadOS can identify itself as macOS, hence the MacIntel touch check.
  (() => {

    const ipadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
    if (/Android|iPad|iPhone|iPod|Silk|Kindle|PlayBook|Mobile|Tablet/i.test(ua) || ipadOS) {
      document.documentElement.classList.add('gamehub-handheld');
    }
  })();

<script>
'use strict';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrap=a=>Math.atan2(Math.sin(a),Math.cos(a));
const MISSIONS=[{name:'Horizon Run',sub:'Learn the route',n:8,curve:.18,climb:25},{name:'Switchback',sub:'Follow the bends',n:10,curve:.46,climb:45},{name:'Sky Circuit',sub:'Earn your wings',n:12,curve:.65,climb:65}];
function makeCourse(m){let x=0,y=0;return Array.from({length:m.n},(_,i)=>{const a=m.curve*Math.sin(i*.8);x+=Math.cos(a)*800;y+=Math.sin(a)*800;return {x,y,z:180+Math.sin(i*.9)*m.climb,a,coins:[false,false]};});}
function crossing(p,q,g){const c=Math.cos(g.a),s=Math.sin(g.a),a=(p.x-g.x)*c+(p.y-g.y)*s,b=(q.x-g.x)*c+(q.y-g.y)*s;if(a>=0||b<0)return null;const t=-a/(b-a),side=-(p.x+(q.x-p.x)*t-g.x)*s+(p.y+(q.y-p.y)*t-g.y)*c,z=p.z+(q.z-p.z)*t-g.z;return (side/110)**2+(z/65)**2;}
function medal(hits,total,perfect){return hits===total&&perfect>=Math.ceil(total*.4)?3:hits>=Math.ceil(total*.9)?2:hits>=Math.ceil(total*.7)?1:0;}
function readSave(){try{const s=JSON.parse(localStorage.getItem('gamehub-pilot-v1'));return {unlocked:clamp(Number(s?.unlocked)||0,0,2),best:[0,1,2].map(i=>Math.max(0,Number(s?.best?.[i])||0)),medals:[0,1,2].map(i=>clamp(Number(s?.medals?.[i])||0,0,3))};}catch{return {unlocked:0,best:[0,0,0],medals:[0,0,0]};}}
class Pilot extends Phaser.Scene{
 constructor(){super('Pilot');}
 preload(){this.load.image('home','../assets/retBut.png');this.load.image('homeDown','../assets/retBut_clicked.png');for(const [k,f] of Object.entries({sky:'sky.png',map:'map_lrg.jpg',cockpit:'cockpit_2.png',apache:'ap.jpg',hawk:'bh.jpg',huey:'uh.jpg'}))this.load.image(k,'../assets/wastePilot/'+f);}
 create(){this.save=readSave();this.mode='menu';this.selected=this.save.unlocked;this.aircraft=0;this.zones=[];this.holds=new Map();this.steer={x:0,y:0};this.keys=this.input.keyboard.addKeys('LEFT,RIGHT,UP,DOWN,W,A,S,D,SPACE,SHIFT,P,R,ESC');this.input.addPointer(3);this.input.on('pointerdown',p=>this.down(p));this.input.on('pointermove',p=>this.move(p));this.input.on('pointerup',p=>this.up(p));this.input.on('pointerupoutside',p=>this.up(p));this.scale.on('resize',()=>this.resize());this.game.events.on('blur',()=>this.pause());document.addEventListener('visibilitychange',()=>{if(document.hidden)this.pause();});this.ground=document.createElement('canvas');this.ground.width=240;this.ground.height=120;this.gc=this.ground.getContext('2d');this.pixels=this.gc.createImageData(240,120);this.buildMap();this.resize();}
 buildMap(){const c=document.createElement('canvas');c.width=c.height=256;const ctx=c.getContext('2d');try{if(this.textures.exists('map'))ctx.drawImage(this.textures.get('map').getSourceImage(),0,0,256,256);else{ctx.fillStyle='#527d64';ctx.fillRect(0,0,256,256);for(let y=0;y<256;y+=32)for(let x=0;x<256;x+=32){ctx.fillStyle=(x+y)%64?'#708459':'#496e5c';ctx.fillRect(x+2,y+2,28,28);}}this.map=ctx.getImageData(0,0,256,256).data;}catch{this.map=null;}}
 resize(){const sw=this.scale.width,sh=this.scale.height,k=Math.min(1,1200/sw,1000/sh);this.w=Math.round(sw*k);this.h=Math.round(sh*k);if(this.view)this.view.destroy();if(this.textures.exists('flight'))this.textures.remove('flight');this.tex=this.textures.createCanvas('flight',this.w,this.h);this.ctx=this.tex.context;this.view=this.add.image(0,0,'flight').setOrigin(0).setDisplaySize(sw,sh);this.clearInput();}

 pause(){if(this.mode==='flight'){this.mode='pause';this.clearInput();}}
 start(){this.course=makeCourse(MISSIONS[this.selected]);this.p={x:0,y:0,z:180,a:0};this.gate=0;this.timeLeft=65;this.elapsed=0;this.score=0;this.hits=0;this.perfect=0;this.misses=0;this.combo=0;this.coins=0;this.recoveries=0;this.speed=110;this.energy=100;this.mode='brief';this.lastGround=null;this.message='Aim for the green ring';this.messageTime=4;this.clearInput();}
 recover(){if(this.mode!=='flight')return;this.timeLeft-=8;this.combo=0;this.recoveries++;const g=this.course[this.gate];this.p={x:g.x-Math.cos(g.a)*500,y:g.y-Math.sin(g.a)*500,z:g.z,a:g.a};this.speed=85;this.clearInput();this.message='Back on course · −8 seconds';this.messageTime=3;}
 finish(timeout=false){this.mode='result';this.clearInput();this.grade=timeout?0:medal(this.hits,this.course.length,this.perfect);this.score+=Math.floor(Math.max(0,this.timeLeft))*10;this.newBest=this.score>this.save.best[this.selected];this.save.best[this.selected]=Math.max(this.score,this.save.best[this.selected]);this.save.medals[this.selected]=Math.max(this.grade,this.save.medals[this.selected]);if(this.grade)this.save.unlocked=Math.max(this.save.unlocked,Math.min(2,this.selected+1));try{localStorage.setItem('gamehub-pilot-v1',JSON.stringify(this.save));}catch{}this.timedOut=timeout;}
 update(_,delta){const dt=Math.min(delta/1000,.05);if(Phaser.Input.Keyboard.JustDown(this.keys.P)||Phaser.Input.Keyboard.JustDown(this.keys.ESC)){if(this.mode==='flight')this.pause();else if(this.mode==='pause'){this.mode='flight';this.clearInput();}}if(this.mode==='flight')this.step(dt);this.render();}
 step(dt){if(Phaser.Input.Keyboard.JustDown(this.keys.R))this.recover();const k=this.keys,turn=clamp(this.steer.x+(k.RIGHT.isDown||k.D.isDown?1:0)-(k.LEFT.isDown||k.A.isDown?1:0),-1,1),lift=clamp(-this.steer.y+(k.UP.isDown||k.W.isDown?1:0)-(k.DOWN.isDown||k.S.isDown?1:0),-1,1);const boost=([...this.holds.values()].includes('boost')||k.SPACE.isDown)&&this.energy>1,brake=[...this.holds.values()].includes('brake')||k.SHIFT.isDown;this.energy=clamp(this.energy+dt*(boost?-30:17),0,100);this.speed+=( (brake?55:boost?200:110)-this.speed)*Math.min(1,dt*3);const old={...this.p};this.p.a+=turn*.65*dt;this.p.z=clamp(this.p.z+lift*70*dt,75,310);this.p.x+=Math.cos(this.p.a)*this.speed*dt;this.p.y+=Math.sin(this.p.a)*this.speed*dt;this.elapsed+=dt;this.timeLeft-=dt;this.messageTime-=dt;const g=this.course[this.gate];for(let j=0;j<2;j++){const coin=this.coinPos(g,j);if(!g.coins[j]&&Math.hypot(this.p.x-coin.x,this.p.y-coin.y)<85&&Math.abs(this.p.z-coin.z)<40){g.coins[j]=true;this.coins++;this.score+=50;}}
 const norm=crossing(old,this.p,g);if(norm!==null){if(norm<=1){this.hits++;this.combo++;const perfect=norm<=.18;if(perfect)this.perfect++;this.score+=(perfect?450:250)+Math.min(5,this.combo)*50;this.timeLeft+=6;this.message=(perfect?'PERFECT':'RING CLEAR')+' · +6 seconds';}else{this.misses++;this.combo=0;this.timeLeft-=4;this.message='Missed ring · −4 seconds';}this.messageTime=2;this.gate++;if(this.gate===this.course.length){this.finish(this.timeLeft<=0);return;}}
 if(this.timeLeft<=0)this.finish(true);}
 coinPos(g,j){const d=420-j*210;return {x:g.x-Math.cos(g.a)*d,y:g.y-Math.sin(g.a)*d,z:g.z};}
 project(o){const dx=o.x-this.p.x,dy=o.y-this.p.y,c=Math.cos(this.p.a),s=Math.sin(this.p.a),d=dx*c+dy*s;if(d<12)return null;const focal=Math.min(this.w*.65,this.h*.95);return {x:this.w/2+(-dx*s+dy*c)*focal/d,y:this.h*.43+(this.p.z-o.z)*focal/d,d,f:focal};}
 groundDraw(){const out=this.pixels.data,c=Math.cos(this.p.a),s=Math.sin(this.p.a);for(let y=0;y<120;y++){const dist=this.p.z*120/(y+2);for(let x=0;x<240;x++){const side=(x/120-1)*dist,wx=this.p.x+dist*c-side*s,wy=this.p.y+dist*s+side*c,ix=((Math.floor(wx*.1)%256)+256)%256,iy=((Math.floor(wy*.1)%256)+256)%256,i=(y*240+x)*4,m=(iy*256+ix)*4,fog=Math.min(.85,dist/5000);for(let n=0;n<3;n++)out[i+n]=(this.map?this.map[m+n]:[72,113,90][n])*(1-fog)+[148,191,191][n]*fog;out[i+3]=255;}}this.gc.putImageData(this.pixels,0,0);}
 text(t,x,y,size=18,color='#edf8f7',align='left',weight=600){const c=this.ctx;c.font=weight+' '+size+'px system-ui,sans-serif';c.textAlign=align;c.textBaseline='middle';c.fillStyle=color;c.fillText(t,x,y);}
 box(x,y,w,h,fill='#153b48',r=14){const c=this.ctx;c.fillStyle=fill;c.beginPath();c.roundRect(x,y,w,h,r);c.fill();}
 button(label,x,y,w,h,fn,primary=false){this.box(x,y,w,h,primary?'#adebba':'#214d5b');this.text(label,x+w/2,y+h/2,Math.min(18,w/10+5),primary?'#133e39':'#eef8f5','center');this.zones.push({x,y,w,h,action:fn});}
 img(key,x,y,w,h){if(!this.textures.exists(key))return false;this.ctx.drawImage(this.textures.get(key).getSourceImage(),x,y,w,h);return true;}
 home(){const size=48;this.box(10,10,size,size,'#123641bb');if(!this.img('home',10,10,size,size))this.text('⌂',34,34,32,'white','center');this.zones.push({x:10,y:10,w:size,h:size,action:()=>{location.href='../index.html';}});}
 render(){const c=this.ctx,w=this.w,h=this.h;this.zones=[];c.clearRect(0,0,w,h);if(this.mode==='menu'){this.menu();}else{this.world();if(this.mode==='flight')this.hud();else this.overlay();}this.home();this.tex.refresh();}
 menu(){const w=this.w,h=this.h,c=this.ctx,compact=h<550;const bg=c.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#173e50');bg.addColorStop(1,'#0b202b');c.fillStyle=bg;c.fillRect(0,0,w,h);const titleY=compact?40:80;this.text('WASTE PILOT',w/2,titleY,Math.min(42,w/12),'#c3f4ce','center',800);this.text('Fly the route. Build a streak. Earn your wings.',w/2,titleY+35,Math.min(16,w/27),'#9bbbc3','center');const bw=Math.min(560,w-32),x=(w-bw)/2,y=titleY+70,row=compact?54:70;for(let i=0;i<3;i++){const unlocked=i<=this.save.unlocked;this.box(x,y+i*row,bw,row-7,this.selected===i?'#346855':'#1c3c49');this.text(MISSIONS[i].name,x+16,y+i*row+(row-7)/2,18,unlocked?'#ffffff':'#78929b');this.text(unlocked?(this.save.medals[i]?['','BRONZE','SILVER','GOLD'][this.save.medals[i]]:'READY'):'LOCKED',x+bw-16,y+i*row+(row-7)/2,13,'#b3d9bf','right');if(unlocked)this.zones.push({x,y:y+i*row,w:bw,h:row-7,action:()=>{this.selected=i;}});}
 const cy=y+3*row+15;this.text('AIRCRAFT  ·  '+['APACHE','BLACK HAWK','HUEY'][this.aircraft],w/2,cy,15,'#b0cbd1','center');this.button('‹',x,cy-20,48,40,()=>{this.aircraft=(this.aircraft+2)%3;});this.button('›',x+bw-48,cy-20,48,40,()=>{this.aircraft=(this.aircraft+1)%3;});const by=Math.max(cy+38,h-102);if(by-cy>130)this.img(['apache','hawk','huey'][this.aircraft],w/2-80,cy+25,160,90);this.button('FLY '+MISSIONS[this.selected].name.toUpperCase(),x,by,bw,52,()=>this.start(),true);this.text('Left thumb: turn / climb • Right thumb: boost / slow',w/2,by+72,Math.min(14,w/30),'#9bbbc3','center');}
 world(){const c=this.ctx,w=this.w,h=this.h;c.fillStyle='#91bdc9';c.fillRect(0,0,w,h);this.img('sky',0,0,w,h*.56);if(!this.lastGround||this.elapsed-this.lastGround>.045||this.mode!=='flight'){this.groundDraw();this.lastGround=this.elapsed;}c.drawImage(this.ground,0,h*.43,w,h*.57);for(let i=Math.min(this.course.length-1,this.gate+3);i>=this.gate;i--){const g=this.course[i],p=this.project(g);if(!p)continue;const rx=110*p.f/p.d,ry=65*p.f/p.d;if(rx>w*3)continue;c.globalAlpha=i===this.gate?1:.35;c.strokeStyle=i===this.gate?'#b7ff91':'#e5f9ee';c.lineWidth=i===this.gate?Math.max(4,rx*.075):3;c.beginPath();c.ellipse(p.x,p.y,rx,ry,0,0,Math.PI*2);c.stroke();if(i===this.gate){for(let j=0;j<2;j++)if(!g.coins[j]){const coin=this.project(this.coinPos(g,j));if(coin){const r=clamp(12*coin.f/coin.d,3,17);c.fillStyle='#ffdd71';c.beginPath();c.arc(coin.x,coin.y,r,0,Math.PI*2);c.fill();}}}c.globalAlpha=1;}
 // Small cockpit sill preserves the main view in either orientation.
 const ch=Math.min(h*.16,100);if(!this.img('cockpit',0,h-ch,w,ch)){this.box(0,h-18,w,18,'#18313b',0);}const cx=w/2,cy=h*.43;c.strokeStyle='#ffffffaa';c.lineWidth=2;c.beginPath();c.moveTo(cx-12,cy);c.lineTo(cx-4,cy);c.moveTo(cx+4,cy);c.lineTo(cx+12,cy);c.moveTo(cx,cy-8);c.lineTo(cx,cy-3);c.stroke();}

 overlay(){const w=this.w,h=this.h;this.ctx.fillStyle='#071f2deb';this.ctx.fillRect(0,0,w,h);const bw=Math.min(420,w-36),x=(w-bw)/2;if(this.mode==='brief'){const top=Math.max(75,h*.18);this.text(MISSIONS[this.selected].name,w/2,top,30,'#c1efcd','center');this.text(this.course.length+' RINGS · '+['APACHE','BLACK HAWK','HUEY'][this.aircraft],w/2,top+38,16,'#9cbcc7','center');const lines=['Clear at least 70% of rings to unlock the next route.','Each ring adds 6 seconds. A miss costs 4 seconds.','Aim through the centre for perfects and score streaks.','Drag the left pad to turn and climb. Cruise is automatic.','Hold BOOST for speed or SLOW for tight approaches.'];lines.forEach((t,i)=>this.text(t,w/2,top+84+i*28,Math.min(15,w/35),'#d2e5e4','center'));this.button('TAKE OFF',x,Math.max(top+250,h-100),bw,54,()=>{this.mode='flight';this.clearInput();},true);return;}if(this.mode==='pause'){this.text('FLIGHT PAUSED',w/2,h*.25,30,'#c1efcd','center');this.text('Arrows / WASD: steer and climb',w/2,h*.25+42,15,'#b5d1d9','center');this.text('Space: boost · Shift: slow · R: recover',w/2,h*.25+68,14,'#b5d1d9','center');this.button('RESUME',x,h*.5,bw,52,()=>{this.mode='flight';this.clearInput();},true);this.button('RESTART MISSION',x,h*.5+64,bw,48,()=>this.start());this.button('MISSION SELECT',x,h*.5+124,bw,48,()=>{this.mode='menu';});return;}
 const top=Math.max(72,h*.16);this.text(this.grade?['','BRONZE','SILVER','GOLD'][this.grade]+' WINGS':this.timedOut?'TIME’S UP':'TRAINING COMPLETE',w/2,top,Math.min(32,w/15),'#caefba','center',800);this.text(MISSIONS[this.selected].name,w/2,top+36,18,'#a9c9d3','center');this.text(this.score+' POINTS'+(this.newBest?' · NEW BEST':''),w/2,top+78,22,'#ffdf91','center');this.text(`${this.hits}/${this.course.length} rings · ${this.perfect} perfect · ${this.coins} coins`,w/2,top+115,16,'#eef6ed','center');this.text(this.grade?(this.selected===2?'All missions unlocked. Chase gold on every route!':'Next mission unlocked. Ready for another flight?'):'Clear 70% of rings before time runs out for bronze.',w/2,top+148,Math.min(14,w/34),'#b8d0d3','center');const by=Math.max(top+185,h-182);this.button(this.grade&&this.selected<2?'NEXT MISSION':'FLY AGAIN',x,by,bw,50,()=>{if(this.grade&&this.selected<2)this.selected++;this.start();},true);if(this.grade&&this.selected<2)this.button('RETRY FOR GOLD',x,by+60,bw,44,()=>this.start());this.button('MISSION SELECT',x,by+(this.grade&&this.selected<2?114:62),bw,44,()=>{this.mode='menu';});}
}
