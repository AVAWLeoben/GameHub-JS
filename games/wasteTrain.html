<script>
'use strict';
const W=1485,H=1100,CELL=55;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mix=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
const key=p=>p.x.toFixed(3)+','+p.y.toFixed(3);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pos=([x,y])=>({x:(x+.5)*CELL,y:(y+.5)*CELL});
const tileKey=(x,y)=>x+','+y;
const $=id=>document.getElementById(id);
function projection(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,n=dx*dx+dy*dy;
  const t=n?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/n,0,1):0;
  const q=mix(a,b,t);return {q,t,d:dist(p,q)};
}
function intersection(a,b,c,d){
  const vx=b.x-a.x,vy=b.y-a.y,wx=d.x-c.x,wy=d.y-c.y,det=vx*wy-vy*wx;
  if(Math.abs(det)<1e-7)return null;
  const dx=c.x-a.x,dy=c.y-a.y,t=(dx*wy-dy*wx)/det,u=(dx*vy-dy*vx)/det;
  return t>=-1e-6&&t<=1.000001&&u>=-1e-6&&u<=1.000001?{t:clamp(t,0,1),u:clamp(u,0,1)}:null;
}
function smooth(raw){

    const a=raw[Math.max(0,i-1)],b=raw[i],c=raw[i+1],d=raw[Math.min(raw.length-1,i+2)];
    const steps=Math.max(2,Math.ceil(dist(b,c)/7));
    for(let j=1;j<=steps;j++){
      const t=j/steps,t2=t*t,t3=t2*t;
      const coordinate=k=>.5*(2*b[k]+(-a[k]+c[k])*t+(2*a[k]-5*b[k]+4*c[k]-d[k])*t2+(-a[k]+3*b[k]-3*c[k]+d[k])*t3);

}
class Network{
  constructor(grid,curves,structures){
    this.raw=[];this.nodes=new Map();
    const add=(a,b,kind='normal',group='',index=0)=>{if(dist(a,b)>.1)this.raw.push({a,b,kind,group,index});};
    for(const cell of grid){
      const [x,y]=cell.split(',').map(Number),p=pos([x,y]);
      for(const [dx,dy] of [[1,0],[0,1]])if(grid.has(tileKey(x+dx,y+dy)))add(p,pos([x+dx,y+dy]));
      if(![[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>grid.has(tileKey(x+dx,y+dy))))add({x:p.x-11,y:p.y},{x:p.x+11,y:p.y});
    }
    curves.forEach((curve,i)=>{for(let j=1;j<curve.length;j++)add(curve[j-1],curve[j],'normal','curve'+i,j);});
    structures.forEach(s=>add(s.a,s.b,s.kind));
    const splits=this.raw.map(e=>[{t:0,p:e.a},{t:1,p:e.b}]),buckets=new Map();
    this.raw.forEach((e,i)=>{
      if(e.kind!=='normal')return;
      const cells=[],candidates=new Set();
      for(let x=Math.floor(Math.min(e.a.x,e.b.x)/48);x<=Math.floor(Math.max(e.a.x,e.b.x)/48);x++){
        for(let y=Math.floor(Math.min(e.a.y,e.b.y)/48);y<=Math.floor(Math.max(e.a.y,e.b.y)/48);y++){
          const cell=x+','+y;cells.push(cell);(buckets.get(cell)||[]).forEach(n=>candidates.add(n));
        }

      for(const j of candidates){
        const other=this.raw[j];
        if(e.group&&e.group===other.group&&Math.abs(e.index-other.index)<=1)continue;
        const hit=intersection(e.a,e.b,other.a,other.b);
        if(hit){const p=mix(e.a,e.b,hit.t);splits[i].push({t:hit.t,p});splits[j].push({t:hit.u,p});}
      }
      for(const cell of cells){if(!buckets.has(cell))buckets.set(cell,[]);buckets.get(cell).push(i);}

    curves.forEach((curve,index)=>{
      for(const endpoint of [curve[0],curve[curve.length-1]]){
        this.raw.forEach((e,i)=>{
          if(e.kind!=='normal'||e.group==='curve'+index)return;
          const hit=projection(endpoint,e.a,e.b);
          if(hit.d<.85){splits[i].push({t:hit.t,p:hit.q});this.link(endpoint,hit.q,'normal');}
        });
      }
    });

      const ordered=splits[i].sort((a,b)=>a.t-b.t);
      for(let j=1;j<ordered.length;j++)this.link(ordered[j-1].p,ordered[j].p,e.kind);

  }
  link(a,b,kind){

  nearest(p){

    for(const node of this.nodes.values())if(dist(p,node.p)<best){best=dist(p,node.p);result=node.p;}
    return {...result};
  }
}
const assets={
 station_old:['station.png',245,163],station_blue:['stations/station_blue.png',220,160],
 station_red:['stations/station_red.png',220,160],station_green:['stations/station_green.png',220,160],
 tree_broadleaf:['scenery/tree_broadleaf.png',105,105],tree_pine:['scenery/tree_pine.png',76,114],
 rock_cluster:['scenery/rock_cluster.png',110,83],flower_bush:['scenery/flower_bush.png',62,49],
 pond:['scenery/pond.png',270,185],flower_patch:['scenery/flower_patch.png',55,40],grass_tuft:['scenery/grass_tuft.png',42,34],
 tunnel_horizontal:['scenery/tunnel_horizontal.png',629,231],bridge_horizontal:['scenery/bridge_horizontal.png',553,227],
 locomotive_red:['trains/locomotive_red.png',91,57],locomotive_blue:['trains/locomotive_blue.png',91,57],
 wagon_passenger_red:['trains/wagon_passenger_red.png',74,49],wagon_passenger_blue:['trains/wagon_passenger_blue.png',74,49],
 wagon_freight_green:['trains/wagon_freight_green.png',70,49],wagon_logs:['trains/wagon_logs.png',74,49],
 wagon_tanker_gold:['trains/wagon_tanker_gold.png',74,49],wagon_coal_gray:['trains/wagon_coal_gray.png',74,49]

if(!window.Phaser)$('status').textContent='Could not load Phaser. Check your connection and reload.';

function launch(){

  preload(){
    for(const [name,[path]] of Object.entries(assets))this.load.image(name,'../assets/wasteTrain/'+path);
    this.load.image('grass','../assets/hungryHedgie/grass.png');
    this.load.json('manifest','../assets/wasteTrain/sprites_manifest.json');
  }
  create(){
    $('status').hidden=true;
    this.mode='tiles';this.follow=false;this.pointers=new Map();this.gesture=null;
    this.camera=this.cameras.main;this.camera.setBounds(0,0,W,H);
    this.group=this.add.group();
    this.manifest=new Map((this.cache.json.get('manifest')?.sprites||[]).map(e=>[e.name,e]));
    this.input.addPointer(3);
    document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{
      this.cancel();this.mode=button.dataset.mode;this.follow=false;this.refreshButtons();
    });
    $('follow').onclick=()=>{this.follow=!this.follow;this.refreshButtons();};
    $('new').onclick=()=>{
      if(this.confirmUntil>performance.now()){this.newWorld();this.confirmUntil=0;this.notice('Build a new railway!');}
      else{this.confirmUntil=performance.now()+2600;this.notice('Tap New again to start a new world.');}
    };
    $('in').onclick=()=>this.zoomAt(1.25,{x:400,y:260});
    $('out').onclick=()=>this.zoomAt(.8,{x:400,y:260});
    this.input.on('pointerdown',p=>this.down(p));
    this.input.on('pointermove',p=>this.move(p));
    this.input.on('pointerup',p=>this.up(p));
    this.input.on('pointerupoutside',p=>this.up(p,true));
    this.input.on('wheel',(p,objects,dx,dy)=>this.zoomAt(Math.exp(-dy*.001),p));
    const cancel=()=>{this.cancel();this.pointers.clear();};

  notice(text){$('notice').textContent=text;clearTimeout(this.noticeTimer);this.noticeTimer=setTimeout(()=>$('notice').textContent='Two fingers to pan and zoom',5000);}

  }
  art(name,p,depth=3){

  newWorld(){
    this.cancel();this.group.clear(true,true);this.train=null;this.follow=false;

    for(const t of this.stations)for(const [x,y] of [t,[t[0],t[1]+1]])this.pinned.add(tileKey(x,y));

      s.a=pos(s.left);s.b=pos(s.right);
      for(const [x,y] of [s.left,s.right,[s.left[0]-1,s.left[1]],[s.right[0]+1,s.right[1]]])this.pinned.add(tileKey(x,y));

  }
  structureArt(s){

    const right=ports.right_port||ports.right_rail||(s.kind==='tunnel'?[.985,.70]:[.988,.36]);

  renderRails(){

  world(p){return {x:this.cx+p.x/this.zoom,y:this.cy+p.y/this.zoom};}

    const g=this.gesture,x=Math.floor(p.x/CELL),y=Math.floor(p.y/CELL),cell=tileKey(x,y);
    if(x<0||x>=27||y<0||y>=20)return;
    if(this.mode==='tiles'&&!this.blocked.has(cell)){g.grid.add(cell);g.changed=true;}
    if(this.mode==='erase'){
      if(!this.pinned.has(cell)){g.changed=g.grid.delete(cell)||g.changed;}
      g.curves=g.curves.filter(curve=>{
        const hit=curve.some((q,i)=>i&&projection(p,curve[i-1],q).d<=21);if(hit)g.changed=true;return !hit;
      });
    }
    this.preview.clear().lineStyle(4,this.mode==='erase'?0xef9f50:0xffe763).strokeRect(x*CELL,y*CELL,CELL,CELL);
  }
  up(pointer,outside=false){
    const g=this.gesture;
    if(g&&g.id===pointer.id&&!outside){
      if(this.mode==='draw'){
        const end=this.world(pointer);if(dist(g.points[g.points.length-1],end)>2)g.points.push(end);
        if(g.points.length>=2&&g.points.reduce((sum,p,i)=>sum+(i?dist(p,g.points[i-1]):0),0)>30){
          g.points[0]=this.net.nearest(g.points[0]);g.points[g.points.length-1]=this.net.nearest(g.points[g.points.length-1]);
          g.curves.push(smooth(g.points));g.changed=true;
        }
      }
      if(g.changed){
        this.grid=g.grid;this.curves=g.curves;this.net=new Network(this.grid,this.curves,this.structures);this.renderRails();
        if(!this.train)this.startTrain(g.points[g.points.length-1]);
        else if(this.train.stopped)this.depart(this.train.b,this.train.a);
      }
    }
    this.pointers.delete(pointer.id);this.cancel();
  }
  startTrain(focus){
    const entries=[...this.net.nodes.entries()].filter(([,n])=>n.links.size);
    entries.sort((a,b)=>dist(a[1].p,focus)-dist(b[1].p,focus));
    if(!entries.length)return;
    const names=['locomotive_red',...Phaser.Utils.Array.Shuffle(['wagon_passenger_red','wagon_passenger_blue','wagon_freight_green','wagon_logs','wagon_tanker_gold','wagon_coal_gray']).slice(0,3)];
    this.train={a:null,b:entries[0][0],visits:new Map(),history:[],odometer:0,stopped:true,sprites:names.map(name=>this.art(name,focus,6))};
    this.train.sprites.forEach(sprite=>sprite.setVisible(false));this.depart(this.train.b,null);
  }
  depart(node,previous){
    const t=this.train,current=this.net.nodes.get(node);
    if(!current||!current.links.size){t.stopped=true;return;}
    let exits=[...current.links.keys()].filter(n=>n!==previous);
    if(!exits.length)exits=[...current.links.keys()];
    const edgeId=n=>[node,n].sort().join('|');
    const least=Math.min(...exits.map(n=>t.visits.get(edgeId(n))||0));
    exits=exits.filter(n=>(t.visits.get(edgeId(n))||0)===least);
    if(previous&&this.net.nodes.has(previous)&&Math.random()<.75){
      const prev=this.net.nodes.get(previous).p;
      const heading=Math.atan2(current.p.y-prev.y,current.p.x-prev.x);
      exits.sort((a,b)=>{
        const score=id=>{const p=this.net.nodes.get(id).p;return Math.cos(Math.atan2(p.y-current.p.y,p.x-current.p.x)-heading);};
        return score(b)-score(a);
      });
    }else Phaser.Utils.Array.Shuffle(exits);
    const next=exits[0],link=current.links.get(next);
    t.a=node;t.b=next;t.from={...current.p};t.to={...this.net.nodes.get(next).p};t.kind=link.kind;t.length=link.length;t.travel=0;t.stopped=false;
    t.visits.set(edgeId(next),(t.visits.get(edgeId(next))||0)+1);
  }
  update(time,delta){
    this.guide?.setVisible(this.mode==='tiles');
    const t=this.train;if(!t)return;
    let remaining=Math.min(delta/1000,.05)*66;
    for(let step=0;step<80&&remaining>0&&!t.stopped;step++){
      const move=Math.min(remaining,t.length-t.travel);t.travel+=move;t.odometer+=move;remaining-=move;
      const p=mix(t.from,t.to,t.travel/t.length),angle=Math.atan2(t.to.y-t.from.y,t.to.x-t.from.x);
      t.history.push({distance:t.odometer,p,angle,kind:t.kind});
      if(t.travel>=t.length-1e-6)this.depart(t.b,t.a);
    }
    while(t.history.length>2&&t.history[1].distance<t.odometer-300)t.history.shift();
    t.sprites.forEach((sprite,i)=>{
      const target=t.odometer-i*58;
      if(!t.history.length||target<t.history[0].distance){sprite.setVisible(false);return;}
      let sample=t.history[t.history.length-1];
      for(let j=1;j<t.history.length;j++)if(t.history[j].distance>=target){
        const a=t.history[j-1],b=t.history[j],ratio=clamp((target-a.distance)/Math.max(.001,b.distance-a.distance),0,1);
        sample={p:mix(a.p,b.p,ratio),angle:b.angle,kind:ratio<.5?a.kind:b.kind};break;
      }
      sprite.setVisible(sample.kind!=='tunnel').setPosition(sample.p.x,sample.p.y);
      const left=Math.cos(sample.angle)<-.035,tilt=clamp(Math.atan2(Math.sin(sample.angle),Math.max(.2,Math.abs(Math.cos(sample.angle)))),-Math.PI/5,Math.PI/5);
      if(sprite.setFlipX)sprite.setFlipX(left);
      sprite.setRotation(left?-tilt:tilt);
      if(i===0&&this.follow){this.cx+=(sample.p.x-400/this.zoom-this.cx)*Math.min(1,delta/1000*5);this.cy+=(sample.p.y-260/this.zoom-this.cy)*Math.min(1,delta/1000*5);this.syncCamera();}
    });
  }
 }
 new Phaser.Game({type:Phaser.AUTO,parent:'game',width:800,height:530,backgroundColor:'#77b469',scene:Railway,
 scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},audio:{noAudio:true}});
}
