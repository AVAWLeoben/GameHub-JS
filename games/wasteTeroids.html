<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WasteTeroids · GameHub</title>
<style>
body{margin:0;background:#030811;color:#fff;font:18px system-ui;overscroll-behavior:none}
#game{width:100%;height:100vh;height:100dvh}canvas{display:block;touch-action:none}
#status{position:absolute;top:40%;width:100%;text-align:center;white-space:pre-wrap;pointer-events:none}
</style></head><body>
<main id="game" aria-label="WasteTeroids"><p id="status" role="status">Loading WasteTeroids…</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<script>
'use strict';
const STEP=1/120;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function interception(dx,dy,vx,vy,speed){
 const a=vx*vx+vy*vy-speed*speed,b=2*(dx*vx+dy*vy),c=dx*dx+dy*dy;
 if(c<1e-8)return 0;
 if(Math.abs(a)<1e-8)return b<0?-c/b:Math.sqrt(c)/speed;
 const discriminant=b*b-4*a*c;
 if(discriminant<0)return Math.sqrt(c)/speed;
 const roots=[(-b-Math.sqrt(discriminant))/(2*a),(-b+Math.sqrt(discriminant))/(2*a)].filter(t=>t>=0);
 return roots.length?Math.min(...roots):Math.sqrt(c)/speed;
}
function segmentHit(x0,y0,x1,y1,left,top,right,bottom){
 let enter=0,exit=1;
 for(const [origin,delta,low,high] of [[x0,x1-x0,left,right],[y0,y1-y0,top,bottom]]){
  if(Math.abs(delta)<1e-10){if(origin<low||origin>high)return null;continue;}
  const a=(low-origin)/delta,b=(high-origin)/delta;
  enter=Math.max(enter,Math.min(a,b));exit=Math.min(exit,Math.max(a,b));
  if(enter>exit)return null;
 }
 return enter;
}
if(!window.Phaser)document.getElementById('status').textContent='Could not load Phaser. Check your connection and reload.';
else launch();
function launch(){
 class Asteroids extends Phaser.Scene{
  preload(){
   this.failed=[];
   this.load.on('loaderror',file=>this.failed.push(file.url));
   this.load.image('asteroid0','../assets/Asteroid.png');
   for(let i=1;i<4;i++)this.load.image('asteroid'+i,'../assets/wasteTeroids/Asteroid'+(i+1)+'.png');
   this.load.image('player','../assets/wasteTeroids/player.png');
   this.load.image('background','../assets/wasteTeroids/background.jpg');
   this.load.image('home','../assets/retBut.png');
   this.load.image('pressed','../assets/retBut_clicked.png');
  }
  create(){
   if(this.failed.length){
    document.getElementById('status').textContent='These images could not load:\n'+this.failed.join('\n')+'\nOpen this game through GitHub Pages or a local web server.';
    return;
   }
   document.getElementById('status').hidden=true;
   this.w=this.scale.width;this.h=this.scale.height;this.unit=Math.min(this.w/800,this.h/600);
   this.background=this.add.tileSprite(0,0,this.w,this.h,'background').setOrigin(0);
   this.targets=[];this.bullets=[];this.pointer=null;this.points=0;this.accumulator=0;
   this.player={x:this.w/2,y:this.h/2,angle:0,speed:0,vx:0,vy:0,cooldown:0,target:null};
   this.ship=this.add.image(this.player.x,this.player.y,'player').setDepth(3);
   this.projectiles=this.add.graphics().setDepth(4);
   this.aim=this.add.graphics().setDepth(5);
   this.pointsLabel=this.add.text(this.w-12,12,'Points: 0',{
    fontFamily:'system-ui',fontSize:24,color:'#76f2a7',backgroundColor:'#10212c',
    padding:{x:12,y:8}
   }).setOrigin(1,0).setDepth(20);
   this.hint=this.add.text(this.w/2,this.h-18,'Hold to steer and move • Release to aim automatically',{
    fontFamily:'system-ui',fontSize:20,color:'#f1f6ef',backgroundColor:'#10212ccc',
    align:'center',padding:{x:10,y:7}
   }).setOrigin(.5,1).setDepth(20);
   this.home=this.add.image(54,54,'home').setDepth(30).setInteractive({useHandCursor:true});
   this.home.on('pointerdown',()=>this.home.setTexture('pressed'));
   this.home.on('pointerout',()=>this.home.setTexture('home'));
   this.home.on('pointerup',()=>{location.href='../index.html';});
   this.input.on('pointerdown',(p,objects)=>{
    if(objects.includes(this.home)||p.button>0||this.pointer!==null)return;
    this.pointer=p;
   });
   const release=p=>{this.home.setTexture('home');if(this.pointer===p)this.pointer=null;};
   this.input.on('pointerup',release);this.input.on('pointerupoutside',release);
   const cancel=()=>{this.pointer=null;this.accumulator=0;};
   window.addEventListener('blur',cancel);document.addEventListener('visibilitychange',cancel);
   this.game.canvas.addEventListener('touchcancel',cancel);
   this.keys=this.input.keyboard.addKeys('W,A,S,D,SPACE');
   this.scale.on('resize',size=>this.resize(size.width,size.height));
   this.layout();
   this.spawn(this.w/2,this.h*.67,64);
   this.time.delayedCall(7000,()=>this.hint.setVisible(false));
  }
  layout(){
   this.ship.setDisplaySize(96*this.unit,96*this.unit);
   const homeSize=clamp(88*this.unit,64,100);
   this.home.setDisplaySize(homeSize,homeSize).setPosition(homeSize/2+8,homeSize/2+8);
   this.pointsLabel.setPosition(this.w-12,12).setFontSize(clamp(24*this.unit,18,30));
   this.hint.setPosition(this.w/2,this.h-12).setFontSize(clamp(20*this.unit,15,24)).setWordWrapWidth(this.w-35);
  }
  resize(w,h){
   if(!this.player)return;
   const rx=w/this.w,ry=h/this.h,oldUnit=this.unit;
   this.w=w;this.h=h;this.unit=Math.min(w/800,h/600);this.pointer=null;this.accumulator=0;
   this.player.x*=rx;this.player.y*=ry;this.player.speed*=this.unit/oldUnit;
   for(const t of this.targets){t.x*=rx;t.y*=ry;t.vx*=this.unit/oldUnit;t.vy*=this.unit/oldUnit;t.sprite.setDisplaySize(t.size*2*this.unit,t.size*2*this.unit);}
   for(const b of this.bullets){b.x*=rx;b.y*=ry;b.vx*=this.unit/oldUnit;b.vy*=this.unit/oldUnit;}
   this.background.setSize(w,h);this.layout();this.render();
  }
  spawn(x,y,size){
   const speed=Phaser.Math.FloatBetween(120,240)*this.unit,angle=Math.random()*Math.PI*2;
   const sprite=this.add.image(x,y,'asteroid'+Phaser.Math.Between(0,3)).setDisplaySize(size*2*this.unit,size*2*this.unit).setDepth(2);
   this.targets.push({x,y,size,vx:Math.sin(angle)*speed,vy:Math.cos(angle)*speed,age:0,angle:0,hits:4,sprite});
  }
  shoot(){
   const p=this.player;
   this.bullets.push({x:p.x,y:p.y,vx:600*this.unit*Math.cos(p.angle),vy:600*this.unit*Math.sin(p.angle)});
   p.speed-=30*this.unit;
  }
  physics(dt){
   const p=this.player,u=this.unit;
   let angle=p.angle;p.target=null;
   if(this.pointer){
    const dx=this.pointer.x-p.x,dy=this.pointer.y-p.y,d=Math.hypot(dx,dy);
    if(d>25*u)angle=Math.atan2(dy,dx);
    if(d>100*u)p.speed+=10800*u*dt;
   }else{
    let best=Infinity;
    for(const t of this.targets){
     const d=Math.hypot(t.x-p.x,t.y-p.y);
     if(t.size>=8&&d<best){best=d;p.target=t;}
    }
    if(p.target){
     const t=p.target,time=interception(t.x-p.x,t.y-p.y,t.vx,t.vy,600*u);
     angle=Math.atan2(t.y+t.vy*time-p.y,t.x+t.vx*time-p.x);
    }
   }
   angle+=(Number(this.keys.D.isDown)-Number(this.keys.A.isDown))*300*Math.PI/180*dt;
   p.speed+=(Number(this.keys.W.isDown)-Number(this.keys.S.isDown))*10800*u*dt;
   p.angle=angle;p.cooldown-=dt;
   if(p.cooldown<=0){this.shoot();p.cooldown+=.25;}
   p.speed=clamp(p.speed,-600*u,600*u)*Math.pow(.9,dt*60);
   if(Math.abs(p.speed)<6*u)p.speed=0;
   p.vx=p.speed*Math.cos(p.angle);p.vy=p.speed*Math.sin(p.angle);
   // Keep the complete ship on screen, including after rotation of the iPad.
   const half=48*u;
   p.x=clamp(p.x+p.vx*dt,half,this.w-half);p.y=clamp(p.y+p.vy*dt,half,this.h-half);
   this.background.tilePositionX-=p.vx*dt*.1;this.background.tilePositionY-=p.vy*dt*.05;
   for(const t of this.targets){
    t.age+=dt;t.x+=t.vx*dt;t.y+=t.vy*dt;t.angle-=60*dt;
    if(t.x>this.w){t.x=0;t.y=Math.random()*this.h;}else if(t.x<0){t.x=this.w;t.y=Math.random()*this.h;}
    if(t.y>this.h){t.x=Math.random()*this.w;t.y=0;}else if(t.y<0){t.x=Math.random()*this.w;t.y=this.h;}
   }
   const fragments=[];
   this.bullets=this.bullets.filter(b=>{
    const oldX=b.x,oldY=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;
    let struck=null,first=Infinity;
    for(const t of this.targets){
     if(t.hits<=0)continue;
     const radius=(t.size+8)*u;
     const contact=segmentHit(oldX,oldY,b.x,b.y,t.x-radius,t.y-radius,t.x+radius,t.y+radius);
     if(contact!==null&&contact<first){first=contact;struck=t;}
    }
    if(struck){
     this.points+=struck.size;struck.hits--;
     if(struck.size>=16)fragments.push({x:struck.x,y:struck.y,size:Math.floor(struck.size/2)});
     struck.sprite.setTint(0xffbb99);struck.flash=.08;
     return false;
    }
    return b.x>=0&&b.x<=this.w&&b.y>=0&&b.y<=this.h;
   });
   this.targets=this.targets.filter(t=>{
    if(t.hits<=0||(t.size<16&&t.age>.75)){t.sprite.destroy();return false;}
    t.flash=Math.max(0,(t.flash||0)-dt);if(!t.flash)t.sprite.clearTint();return true;
   });
   fragments.forEach(f=>this.spawn(f.x,f.y,f.size));
   if(!this.targets.length){
    this.spawn(0,Math.random()*this.h,64);this.spawn(this.w,Math.random()*this.h,64);
   }
  }
  render(){
   const p=this.player,u=this.unit;
   this.ship.setPosition(p.x,p.y);
   // Keep the source's side-facing ship upright.
   if(p.vx!==0)this.ship.setFlipX(p.vx<0);
   this.projectiles.clear().fillStyle(0xff3f54);
   for(const b of this.bullets)this.projectiles.fillRect(b.x-8*u,b.y-8*u,16*u,16*u);
   for(const t of this.targets)t.sprite.setPosition(t.x,t.y).setAngle(t.angle);
   this.aim.clear();
   this.aim.fillStyle(0x111111).fillCircle(p.x+20*u*Math.cos(p.angle),p.y+20*u*Math.sin(p.angle),5*u);
   if(p.target&&this.targets.includes(p.target))this.aim.lineStyle(Math.max(1,2*u),0xff4757,.8).strokeCircle(p.target.x,p.target.y,p.target.size*2*u);
   this.pointsLabel.setText('Points: '+this.points);
  }
  update(time,delta){
   if(!this.player||document.hidden)return;
   this.accumulator=Math.min(.075,this.accumulator+Math.min(.05,delta/1000));
   while(this.accumulator>=STEP){this.physics(STEP);this.accumulator-=STEP;}
   this.render();
  }
 }
 new Phaser.Game({type:Phaser.AUTO,parent:'game',backgroundColor:'#030811',scene:Asteroids,
 scale:{mode:Phaser.Scale.RESIZE,width:'100%',height:'100%'},audio:{noAudio:true}});
}
</script></body></html>
