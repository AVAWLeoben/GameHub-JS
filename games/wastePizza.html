<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#7e5538">
  <title>Waste Pizza · GameHub</title>
  <style>
    * {box-sizing: border-box;}
    html, body {margin: 0; width: 100%; height: 100%; overflow: hidden; background: #7e5538;}
    body {overscroll-behavior: none; font-family: system-ui, sans-serif;}
    #viewport {position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh;}
    #game {position: absolute; inset: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);}
    canvas {display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;}
    #status, #rotate {position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; text-align: center; gap: 16px; padding: 24px; color: #fff8e9; background: #513527;}
    #status[hidden] {display: none;}
    #status-message {max-width: 600px; overflow-wrap: anywhere;}
    a {color: inherit; min-height: 44px; display: inline-grid; place-items: center;}
    #rotate {display: none; z-index: 3;}
    #rotate p {margin: 0; font-size: 20px;}
    @media (orientation: portrait) {#rotate {display: grid;}}
  </style>
</head>
<body>
  <div id="viewport">
    <main id="game" aria-label="Waste Pizza. Drag ingredients from the cutting board onto the pizza to match the recipe. Drag a topping off the pizza to remove it."></main>
    <div id="status" role="status"><div id="status-message">Loading the kitchen…</div><a href="../index.html">Home</a></div>
    <div id="rotate"><p>Turn your device sideways</p><span>Waste Pizza is played in landscape.</span><a href="../index.html">Home</a></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
  <script>
// Coordinates are CSS pixels. Toppings use normalized pizza coordinates so that
// Safari toolbar changes and device rotation cannot displace an order.
const PIZZA_INGREDIENTS = ['Tomato', 'Cheese', 'Mushroom', 'Mozzarella'];
const pizzaClamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
const pizzaInside = (p, r) => p.x >= r.x && p.y >= r.y && p.x <= r.x + r.w && p.y <= r.y + r.h;

function pizzaLayout(w, h) {
  // Original wastePizza.py setup: an 800x600 Pygame stage, not a fluid 3-column
  // web layout. Keep the recipe ABOVE the cutting board at the right edge.
  const scale = Math.min(w / 800, h / 600);
  const ox = (w - 800 * scale) / 2, oy = (h - 600 * scale) / 2;
  const rect = (x, y, width, height) => ({
    x: ox + x * scale, y: oy + y * scale, w: width * scale, h: height * scale
  });
  const pizza = rect(0, 0, 600, 600);
  const card = rect(600, 0, 200, 250); // Recipe(700,125), size 200x250
  const board = rect(591, 266, 218, 368); // Cuttingboard(700,450), scaled 75%
  const tray = Array.from({length: 4}, (_, type) =>
    ({...rect(611 + (type % 2) * 85, 286 + Math.floor(type / 2) * 95, 75, 75), type}));
  const home = rect(10, 10, 100, 100);
  const clear = rect(10, 500, 75, 75);
  const result = rect(230, 145, 340, 310);
  const next = rect(258, 379, 284, 56);
  return {w, h, scale, stage:rect(0,0,800,600), wide:false,
    pizza, card, board, tray, home, clear, result, next,
    instruction:null, toppingSize:100*scale};
}

class PizzaGame {
  constructor({random = Math.random, completed = 0, onComplete = () => {}, onHome = () => {}, hitPizza = null} = {}) {
    this.random = random;
    this.completed = Number.isSafeInteger(completed) && completed >= 0 ? completed : 0;
    this.onComplete = onComplete;
    this.onHome = onHome;
    this.hitPizza = hitPizza || ((u, v) => Math.hypot(u - 0.5, v - 0.5) < 0.455);
    this.layout = pizzaLayout(1024, 768);
    this.landscape = true;
    this.dirty = true;
    this.nextOrder();
  }
  nextOrder() {
    this.cancel();
    this.pieces = [];
    this.need = [0, 0, 0, 0];
    const types = [0, 1, 2, 3];
    for (let i = 3; i > 0; i--) {
      const j = Math.floor(this.random() * (i + 1));
      [types[i], types[j]] = [types[j], types[i]];
    }
    const count = 1 + Math.floor(this.random() * 4);
    this.order = types.slice(0, count);
    for (const type of this.order) this.need[type] = 2 + Math.floor(this.random() * 4);
    this.mode = 'play';
    this.dirty = true;
  }
  resize(w, h) {
    this.cancel();
    this.landscape = w > h;
    if (this.landscape) this.layout = pizzaLayout(w, h);
    this.dirty = true;
  }
  counts() {
    const counts = [0, 0, 0, 0];
    for (const piece of this.pieces) counts[piece.type]++;
    return counts;
  }
  point(piece) {
    const r = this.layout.pizza;
    return {x: r.x + piece.u * r.w, y: r.y + piece.v * r.h};
  }
  relative(p) {
    const r = this.layout.pizza;
    return {u: (p.x - r.x) / r.w, v: (p.y - r.y) / r.h};
  }
  down(p) {
    if (!this.landscape || this.active) return false;
    const l = this.layout;
    let button = null;
    if (pizzaInside(p, l.home)) button = 'home';
    else if (this.mode === 'result' && pizzaInside(p, l.next)) button = 'next';
    else if (this.mode === 'play' && pizzaInside(p, l.clear)) button = 'clear';
    if (button) this.active = {id: p.id, button};
    else if (this.mode === 'play') {
      const tray = l.tray.find(r => pizzaInside(p, r));
      if (tray) this.active = {id: p.id, type: tray.type, index: -1, ...this.relative(p)};
      else {
        for (let i = this.pieces.length - 1; i >= 0; i--) {
          const q = this.point(this.pieces[i]);
          if (Math.hypot(q.x - p.x, q.y - p.y) <= Math.max(24, l.toppingSize / 2)) {
            this.active = {id: p.id, index: i, ...this.pieces[i]};
            break;
          }
        }
      }
    }
    this.dirty = true;
    return !!this.active;
  }
  move(p) {
    if (this.active?.id !== p.id || this.active.button) return;
    Object.assign(this.active, this.relative(p));
    this.dirty = true;
  }
  up(p) {
    if (this.active?.id !== p.id) return;
    const active = this.active;
    this.active = null;
    if (active.button) {
      const rect = this.layout[active.button];
      if (rect && pizzaInside(p, rect)) {
        if (active.button === 'home') this.onHome();
        else if (active.button === 'next') this.nextOrder();
        else if (active.button === 'clear') this.pieces = [];
      }
    } else {
      const {u, v} = this.relative(p);
      const valid = u >= 0 && v >= 0 && u < 1 && v < 1 && this.hitPizza(u, v);
      if (active.index >= 0) this.pieces.splice(active.index, 1);
      if (valid) this.pieces.push({type: active.type, u, v});
      this.checkOrder();
    }
    this.dirty = true;
  }
  cancel(id = null) {
    if (id === null || this.active?.id === id) this.active = null;
    this.dirty = true;
  }
  checkOrder() {
    if (this.mode !== 'play') return;
    const counts = this.counts();
    if (!counts.every((count, type) => count === this.need[type])) return;
    this.mode = 'result';
    this.completed++;
    this.onComplete(this.completed);
    this.dirty = true;
  }
}

function drawPizzaGame(c, game, assets) {
  const l = game.layout;
  const {w, h} = l;
  const image = (key, r) => {
    const a = assets[key];
    c.drawImage(a, r.x, r.y, r.w, r.h);
  };
  const text = (value, x, y, size, color = '#513527', align = 'center') => {
    c.font = `600 ${size}px system-ui, sans-serif`;
    c.textAlign = align;
    c.textBaseline = 'middle';
    c.fillStyle = color;
    c.fillText(String(value), x, y);
  };
  const box = (r, color, radius = 12) => {
    c.fillStyle = color;
    c.beginPath();
    c.roundRect(r.x, r.y, r.w, r.h, radius);
    c.fill();
  };
  c.clearRect(0, 0, w, h);
  // Source: SCREEN.blit(BACKGROUND_IMAGE, (0,0)), sized 800x600.
  c.fillStyle = '#7e5538'; c.fillRect(0,0,w,h);
  image('kitchen',l.stage);
  image('pizza', l.pizza);
  image('recipe', l.card);
  image('board', l.board);
  for (const r of l.tray) {
    const pad = r.w * 0.05;
    image('i' + r.type, {x: r.x + pad, y: r.y + pad, w: r.w - pad * 2, h: r.h - pad * 2});
  }
  const counts = game.counts();
  const rows = (game.order || [0,1,2,3]).filter(type => game.need[type] > 0);
  const card = l.card;
  rows.forEach((type, index) => {
    const cy = card.y + (66 + index * 40) * l.scale;
    text(`${game.need[type]}×`, card.x + 36*l.scale, cy, 29*l.scale, '#17120c');
    const imageRect = {x:card.x + 100*l.scale, y:cy - 27*l.scale,
                       w:60*l.scale, h:60*l.scale};
    image('i' + type, imageRect);
    if (counts[type] === game.need[type]) {
      image('check', {x:imageRect.x + 5*l.scale,y:imageRect.y + 5*l.scale,
                      w:50*l.scale,h:50*l.scale});
    }
  });
  const topping = (piece, held = false) => {
    const p = game.point(piece);
    const size = l.toppingSize * (held ? 1.08 : 1);
    if (held) {c.save(); c.shadowColor = '#0006'; c.shadowBlur = 8; c.shadowOffsetY = 4;}
    image('i' + piece.type, {x: p.x - size / 2, y: p.y - size / 2, w: size, h: size});
    if (held) c.restore();
  };
  game.pieces.forEach((piece, index) => {
    if (game.active?.index !== index) topping(piece);
  });
  if (game.mode === 'play') {
    image('pizza', l.clear);
    c.strokeStyle = game.active?.button === 'clear' ? '#ffffff' : '#111111';
    c.lineWidth = Math.max(1,2*l.scale);
    c.strokeRect(l.clear.x,l.clear.y,l.clear.w,l.clear.h);
  }
  if (l.instruction) {
    const message = counts.some((n, i) => n > game.need[i]) ? 'Drag extra toppings off the pizza' : 'Drag toppings onto the pizza';
    const lines = l.instruction.wrap
      ? (counts.some((n, i) => n > game.need[i]) ? ['Drag extra toppings', 'off the pizza'] : ['Drag toppings', 'onto the pizza'])
      : [message];
    const size = l.instruction.wrap ? 12 : 14;
    c.font = `600 ${size}px system-ui, sans-serif`;
    const bw = Math.max(...lines.map(line => c.measureText(line).width)) + 12;
    const bh = lines.length * 17 + 8;
    box({x: l.instruction.x - bw / 2, y: l.instruction.y - bh / 2, w: bw, h: bh}, '#fff7e6ed', 8);
    lines.forEach((line, i) => text(line, l.instruction.x, l.instruction.y + (i - (lines.length - 1) / 2) * 17, size));
  }
  if (game.active && !game.active.button) topping(game.active, true);
  if (game.mode === 'result') {
    const r = l.result;
    box(r, '#fff8e9f5', 20);
    const chefSize = Math.min(112, r.h - 166);
    image('chef', {x: r.x + (r.w - chefSize) / 2, y: r.y + 12, w: chefSize, h: chefSize});
    for (const side of [-1, 1]) image('star', {x: r.x + r.w / 2 + side * chefSize * 0.78 - 14, y: r.y + chefSize * 0.44, w: 28, h: 28});
    text('Great pizza!', r.x + r.w / 2, r.y + chefSize + 36, 26);
    text('Order complete', r.x + r.w / 2, r.y + chefSize + 65, 16);
    box(l.next, game.active?.button === 'next' ? '#325a30' : '#447a40');
    text('Next order', l.next.x + l.next.w / 2, l.next.y + l.next.h / 2, 20, '#fff');
  }
  // Home stays visible even while the order-complete card is open.
  image(game.active?.button === 'home' ? 'homeDown' : 'home', l.home);
}

const PIZZA_ASSETS = {
  home: '../assets/retBut.png',
  homeDown: '../assets/retBut_clicked.png',
  kitchen: '../assets/wastePizza/kitchen.jpg',
  pizza: '../assets/wastePizza/pizza.png',
  recipe: '../assets/wastePizza/recipe_card.png',
  board: '../assets/wastePizza/cutting_board.png',
  i0: '../assets/wastePizza/tomato.png',
  i1: '../assets/wastePizza/cheese.png',
  i2: '../assets/wastePizza/mushroom.png',
  i3: '../assets/wastePizza/mozzarella.png',
  check: '../assets/wastePizza/checkmark.png',
  chef: '../assets/wastePizza/pizzachef.png',
  star: '../assets/wastePizza/star.png'
};

function pizzaError(message) {
  document.getElementById('status-message').textContent = message;
  document.getElementById('status').hidden = false;
}

function startPizza() {
  if (typeof Phaser === 'undefined') {
    pizzaError('The game engine could not load. Check your connection and reload.');
    return;
  }
  class PizzaScene extends Phaser.Scene {
    constructor() {super('pizza'); this.failedAssets = [];}
    preload() {
      this.load.on('loaderror', file => this.failedAssets.push(file.src));
      for (const [key, url] of Object.entries(PIZZA_ASSETS)) this.load.image(key, url);
    }
    create() {
      if (this.failedAssets.length) {
        pizzaError('Game artwork could not load: ' + this.failedAssets.join(', '));
        return;
      }
      this.art = Object.fromEntries(Object.keys(PIZZA_ASSETS).map(key => [key, this.textures.get(key).getSourceImage()]));
      // Test the visible pizza artwork, not an invisible rectangular drop zone.
      const maskCanvas = document.createElement('canvas');
      maskCanvas.width = maskCanvas.height = 128;
      const maskContext = maskCanvas.getContext('2d', {willReadFrequently: true});
      maskContext.drawImage(this.art.pizza, 0, 0, 128, 128);
      const mask = maskContext.getImageData(0, 0, 128, 128).data;
      let completed = 0;
      try {completed = JSON.parse(localStorage.getItem('pizza-orders')) || 0;} catch (_) {}
      this.play = new PizzaGame({
        completed,
        hitPizza: (u, v) => mask[(Math.floor(v * 128) * 128 + Math.floor(u * 128)) * 4 + 3] > 64,
        onComplete: count => {try {localStorage.setItem('pizza-orders', JSON.stringify(count));} catch (_) {}},
        onHome: () => {window.location.href = '../index.html';}
      });
      this.pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      this.surface = this.textures.createCanvas('pizza-surface', 1, 1);
      this.picture = this.add.image(0, 0, 'pizza-surface').setOrigin(0);
      this.fit();
      this.scale.on('resize', this.fit, this);
      this.bindPointers();
      this.onBlur = () => this.play.cancel();
      this.onVisibility = () => {if (document.hidden) this.play.cancel();};
      window.addEventListener('blur', this.onBlur);
      document.addEventListener('visibilitychange', this.onVisibility);
      this.events.once('shutdown', () => {
        this.unbindPointers();
        window.removeEventListener('blur', this.onBlur);
        document.removeEventListener('visibilitychange', this.onVisibility);
      });
      document.getElementById('status').hidden = true;
    }
    fit() {
      if (!this.play) return;
      const {width, height} = this.scale;
      this.play.resize(width, height);
      this.surface.setSize(Math.max(1, Math.round(width * this.pixelRatio)), Math.max(1, Math.round(height * this.pixelRatio)));
      this.picture.setSizeToFrame();
      this.picture.setDisplaySize(width, height);
    }
    bindPointers() {
      const canvas = this.game.canvas;
      const point = e => {
        const r = canvas.getBoundingClientRect();
        return {id: e.pointerId, x: (e.clientX - r.left) * this.scale.width / r.width, y: (e.clientY - r.top) * this.scale.height / r.height};
      };
      const down = e => {
        if (e.button !== 0 || !this.play.landscape) return;
        e.preventDefault();
        if (this.play.down(point(e))) {
          try {canvas.setPointerCapture(e.pointerId);} catch (_) {}
        }
      };
      const move = e => {e.preventDefault(); this.play.move(point(e));};
      const up = e => {e.preventDefault(); this.play.up(point(e));};
      const cancel = e => this.play.cancel(e.pointerId);
      const handlers = {pointerdown: down, pointermove: move, pointerup: up, pointercancel: cancel, lostpointercapture: cancel};
      for (const [name, fn] of Object.entries(handlers)) canvas.addEventListener(name, fn, {passive: false});
      this.unbindPointers = () => {
        for (const [name, fn] of Object.entries(handlers)) canvas.removeEventListener(name, fn);
      };
    }
    update() {
      if (!this.play?.dirty || !this.play.landscape) return;
      const c = this.surface.context;
      c.setTransform(this.pixelRatio, 0, 0, this.pixelRatio, 0, 0);
      drawPizzaGame(c, this.play, this.art);
      this.surface.refresh();
      this.play.dirty = false;
    }
  }
  const host = document.getElementById('game');
  const game = new Phaser.Game({
    type: Phaser.CANVAS,
    parent: host,
    backgroundColor: '#7e5538',
    scale: {mode: Phaser.Scale.FIT, width: 800, height: 600, autoCenter: Phaser.Scale.CENTER_BOTH},
    input: {mouse: false, touch: false, keyboard: false, gamepad: false},
    render: {antialias: true},
    scene: PizzaScene
  });
  // Safari can change the available height when its browser bars open/close.
  const refresh = () => {
    if (game.scale.getParentBounds()) game.scale.refresh();
  };
  const observer = new ResizeObserver(refresh);
  observer.observe(host);
  window.visualViewport?.addEventListener('resize', refresh);
}
startPizza();

  </script>
<script src="./layout-compat.js"></script></body>
</html>
